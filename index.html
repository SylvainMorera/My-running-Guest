<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101C48">
<title>My Running Lab</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Running Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Identité My Running Lab : toutes les couleurs se changent ici.
   Couleurs mesurées sur le visuel d'identité fourni : bleu nuit #101C48, bleu #3884C8.
   Le bleu #3884C8 n'a que 3,96:1 sur blanc : il sert aux formes (graphiques, filets) et au grand texte (« Lab »).
   Texte courant, boutons et liens bleus utilisent --azur-fonce #2766A3 (au moins 5:1 sur tous les fonds de l'outil). */
:root {
  --nuit: #101C48;          /* identité : bleu nuit */
  --azur: #3884C8;          /* identité : bleu (formes, grand texte, filets) */
  --azur-fonce: #2766A3;    /* bleu foncé : texte, boutons, liens */
  --azur-clair: #EBF3FA;
  --serie-realise: #3884C8; /* graphiques : séances réalisées */
  --course: #B3261E;        /* courses (compétitions) : au moins 5,4:1 sur tous les fonds de l'outil */
  --course-clair: #FDECEC;
  --blanc: #FFFFFF;
  --texte: #101C48;
  --texte-2: #4A5470;
  --bord: #C8D2DA;
  --fond-2: #F3F6F8;
  --fond-app: #EEF2F7;      /* fond général : les cartes blanches ressortent */
  --ombre: 0 1px 2px rgba(16, 28, 72, .06), 0 3px 10px rgba(16, 28, 72, .06);
  /* Accent secondaire unique : distingue « prévu » de « réalisé » (bleu nuit de l'identité) */
  --prevu: #101C48;
  --prevu-clair: #E8EAF1;
  --rayon: 8px;
  --cible: 44px;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond-app); color: var(--texte);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3 { line-height: 1.2; }
h2 { color: var(--nuit); font-size: 1.35rem; margin: 0; }
h3 { color: var(--azur-fonce); font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
a { color: var(--azur-fonce); }
:focus-visible { outline: 3px solid var(--azur-fonce); outline-offset: 2px; }
[hidden] { display: none !important; }
.evitement { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--blanc); padding: .75rem 1rem; }
.evitement:focus { left: 8px; top: 8px; }
.visuel-masque { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Mise en page ---------- */
.app { min-height: 100vh; }
.topbar .logo { width: 40px; height: 40px; align-self: center; }
.topbar {
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  padding: .75rem 1rem; border-bottom: 3px solid var(--azur); background: var(--blanc);
}
.topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 800; color: var(--nuit); letter-spacing: -.01em; }
/* « Lab » en bleu de l'identité : texte de 20 px en gras = grand texte, contraste 3,96:1 >= 3:1 */
.topbar h1 .lab { color: var(--azur); }
main { padding: 1rem; padding-bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); max-width: 1500px; }
main:focus { outline: none; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; background: var(--blanc); border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav a {
  flex: 1; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--texte-2); text-decoration: none; font-size: .72rem; font-weight: 600;
}
.nav a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav a[aria-current="page"] { color: var(--azur-fonce); box-shadow: inset 0 3px 0 var(--azur); }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
  .nav {
    position: sticky; top: 0; height: 100vh; flex-direction: column; border-top: 0;
    border-right: 1px solid var(--bord); padding: 1rem 0; grid-row: 1 / span 2;
  }
  .nav a { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: .75rem; padding: 0 1.25rem; font-size: .95rem; min-height: 48px; }
  .nav a[aria-current="page"] { box-shadow: inset 4px 0 0 var(--azur); background: var(--azur-clair); }
  main { padding: 1.5rem 2rem 6rem; }
}

/* ---------- Boutons et champs ---------- */
.btn {
  min-height: var(--cible); min-width: var(--cible); padding: .5rem 1rem; border-radius: var(--rayon);
  border: 1px solid var(--azur-fonce); background: var(--blanc); color: var(--azur-fonce);
  font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  text-decoration: none;
}
.btn:hover { background: var(--azur-clair); }
.btn.primaire { background: var(--azur-fonce); color: var(--blanc); }
.btn.primaire:hover { background: #1E5486; }
.btn.prevu { border-color: var(--prevu); color: var(--prevu); }
.btn.prevu:hover { background: var(--prevu-clair); }
.btn.discret { border-color: var(--bord); color: var(--texte); }
.btn.petit { padding: .35rem .7rem; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; font-weight: 600; color: var(--texte); }
input, select, textarea {
  font: inherit; font-weight: 400; color: var(--texte); background: var(--blanc);
  min-height: var(--cible); padding: .45rem .6rem; border: 1px solid #8A97A3; border-radius: 6px; width: 100%;
}
textarea { min-height: 5rem; resize: vertical; }
input[type="radio"], input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--azur-fonce); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-size: .9rem; font-weight: 600; padding: 0; margin-bottom: .25rem; }
.aide { font-size: .85rem; color: var(--texte-2); font-weight: 400; }

.vue-tete { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
.vue-tete .actions { display: flex; gap: .5rem; flex-wrap: wrap; }

.carte { border: 1px solid #DCE3EA; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; background: var(--blanc); box-shadow: var(--ombre); }
.carte h3 { margin-top: 0; color: var(--nuit); font-size: 1.08rem; }

.badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: .1rem .45rem; border-radius: 4px; border: 1px solid currentColor; letter-spacing: .02em; }
.badge.prevu { color: var(--prevu); background: var(--prevu-clair); }
.badge.realise { color: var(--azur-fonce); background: var(--azur-clair); }
.badge.demo { color: var(--texte); background: var(--fond-2); }

.banniere {
  display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; justify-content: space-between;
  margin: .75rem 1rem 0; padding: .6rem .9rem; border-radius: var(--rayon);
  border: 1px solid var(--azur-fonce); background: var(--azur-clair);
}
@media (min-width: 900px) { .banniere { margin: 1rem 2rem 0; max-width: 1136px; } }

/* ---------- Journal ---------- */
.filtres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; margin-bottom: .75rem; }
.filtres .large { grid-column: 1 / -1; }
.filtres .boutons { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; }
@media (min-width: 900px) {
  .filtres { grid-template-columns: 2fr repeat(3, 1fr) repeat(2, 1fr); align-items: end; }
  .filtres .large { grid-column: auto; }
}
.resume { color: var(--texte-2); font-size: .9rem; margin: .5rem 0 1rem; }
.bloc-filtres > summary { margin-bottom: .5rem; }

.table-wrap { overflow-x: auto; }
table.journal { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.journal th, table.journal td { padding: .45rem .5rem; border-bottom: 1px solid var(--bord); text-align: left; vertical-align: middle; white-space: nowrap; }
table.journal th { position: sticky; top: 0; background: var(--blanc); }
table.journal th button { all: unset; cursor: pointer; font-weight: 700; color: var(--azur-fonce); min-height: 44px; display: inline-flex; align-items: center; }
table.journal th button:focus-visible { outline: 3px solid var(--azur-fonce); }
table.journal td.num, table.journal th.num { text-align: right; }
table.journal tr.est-prevue td:first-child { box-shadow: inset 4px 0 0 var(--prevu); }
table.journal tr.est-realisee td:first-child { box-shadow: inset 4px 0 0 var(--azur-fonce); }
table.journal td.notes { max-width: 160px; overflow: hidden; text-overflow: ellipsis; color: var(--texte-2); }
.acts { display: flex; gap: .3rem; flex-wrap: wrap; }
table.journal .acts { flex-wrap: nowrap; }

.cartes-seances { display: none; }
@media (max-width: 899px) {
  .table-wrap { display: none; }
  .cartes-seances { display: flex; flex-direction: column; gap: .6rem; }
}
.cs { border: 1px solid var(--bord); border-left: 5px solid var(--azur-fonce); border-radius: var(--rayon); padding: .6rem .75rem; }
.cs.est-prevue { border-left-color: var(--prevu); border-left-style: dashed; background: var(--prevu-clair); }
.cs-tete { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; font-weight: 600; }
.cs-tete .type { color: var(--azur-fonce); }
.cs-chiffres { display: flex; flex-wrap: wrap; gap: .2rem 1rem; margin: .35rem 0; font-size: .95rem; }
.cs-chiffres b { font-size: 1.05rem; }
.cs-notes { color: var(--texte-2); font-size: .9rem; margin: .2rem 0 .4rem; }
.cs-actions { display: flex; flex-wrap: wrap; gap: .4rem; }

.vide { padding: 2rem 1rem; text-align: center; color: var(--texte-2); border: 1px dashed var(--bord); border-radius: var(--rayon); background: var(--blanc); }

/* ---------- Bouton flottant ---------- */
.fab {
  position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 25;
  min-height: 48px; padding: 0 1.1rem; border-radius: 24px; border: 0;
  background: var(--azur-fonce); color: var(--blanc); font: inherit; font-weight: 700; font-size: 1rem;
  box-shadow: 0 2px 8px rgba(16, 28, 72, .3); cursor: pointer; font-size: .95rem;
}
@media (min-width: 900px) { .fab { bottom: 24px; right: 24px; } }

/* ---------- Dialogue (formulaires) ---------- */
dialog {
  border: 0; padding: 0; border-radius: 12px; width: min(640px, 100vw - 16px); max-height: calc(100vh - 16px);
  color: var(--texte); background: var(--blanc);
}
dialog::backdrop { background: rgba(10, 20, 30, .5); }
@media (max-width: 640px) {
  dialog { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; margin: 0; border-radius: 0; }
}
dialog form { display: flex; flex-direction: column; max-height: inherit; height: 100%; }
.dlg-tete { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .75rem 1rem; border-bottom: 1px solid var(--bord); }
.dlg-tete h2 { font-size: 1.15rem; }
.dlg-corps { padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: .85rem; flex: 1; }
.dlg-pied { display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--bord); }
.dlg-pied .btn.primaire { flex: 1 1 auto; }
.btn-icone { min-width: var(--cible); min-height: var(--cible); border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--texte); border-radius: 6px; }

.grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.grille3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.duree-champs { display: flex; align-items: center; gap: .35rem; }
.duree-champs input { text-align: center; }
.duree-champs span { font-weight: 700; }

.seg { display: flex; border: 1px solid var(--azur-fonce); border-radius: var(--rayon); overflow: hidden; }
.seg label { flex: 1; flex-direction: row; align-items: center; justify-content: center; min-height: var(--cible); cursor: pointer; font-size: 1rem; gap: .4rem; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label:has(input:checked) { background: var(--azur-fonce); color: var(--blanc); }
.seg label.prevu:has(input:checked) { background: var(--prevu); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--azur-fonce); outline-offset: -3px; }

.ressenti { display: flex; gap: .4rem; flex-wrap: wrap; }
.ressenti label { flex-direction: row; align-items: center; justify-content: center; min-width: var(--cible); min-height: var(--cible); border: 1px solid var(--bord); border-radius: 6px; cursor: pointer; font-size: 1rem; }
.ressenti input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ressenti label:has(input:checked) { background: var(--azur-fonce); color: var(--blanc); border-color: var(--azur-fonce); }
.ressenti label:has(input:focus-visible) { outline: 3px solid var(--azur-fonce); }

.calcules { background: var(--fond-2); border-radius: var(--rayon); padding: .6rem .75rem; display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .95rem; }
.calcules b { color: var(--azur-fonce); }
details summary { cursor: pointer; font-weight: 600; color: var(--azur-fonce); min-height: var(--cible); display: flex; align-items: center; }
details[open] > div { display: flex; flex-direction: column; gap: .85rem; }
.erreurs:empty { display: none; }
.erreurs { border: 2px solid var(--texte); border-radius: var(--rayon); padding: .5rem .75rem; font-weight: 600; }
.erreurs ul { margin: .25rem 0 0; padding-left: 1.2rem; }
[aria-invalid="true"] { border: 2px solid var(--texte); background: #FFF8E1; }

/* ---------- Listes simples (réglages) ---------- */
table.simple { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.simple th, table.simple td { padding: .4rem .5rem; border-bottom: 1px solid var(--bord); text-align: left; }
table.simple td.num, table.simple th.num { text-align: right; }
.form-ligne { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; align-items: end; }

/* ---------- Notifications ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 84px + env(safe-area-inset-bottom)); z-index: 40; display: flex; flex-direction: column; gap: .5rem; width: min(520px, calc(100vw - 32px)); }
@media (min-width: 900px) { #toasts { bottom: 96px; } }
.toast { background: var(--texte); color: var(--blanc); border-radius: var(--rayon); padding: .5rem .5rem .5rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.toast button { min-height: var(--cible); background: none; color: var(--azur); border: 1px solid var(--azur); border-radius: 6px; font: inherit; font-weight: 700; padding: 0 .9rem; cursor: pointer; }

.tests li.ok::marker { content: "OK  "; color: var(--azur-fonce); font-weight: 700; }
.tests li.ko::marker { content: "ÉCHEC  "; font-weight: 700; }
.tests li.ko { font-weight: 700; }

/* ---------- Tableau de bord ---------- */
.hero { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.hero-chiffre { font-size: 3rem; font-weight: 700; color: var(--azur-fonce); line-height: 1; }
.grille-cartes { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grille-cartes { grid-template-columns: repeat(3, 1fr); } }
.grille-cartes .carte { margin-bottom: 0; }
.grille-cartes { margin-bottom: 1rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.stat { display: flex; flex-direction: column; background: var(--fond-2); border-radius: 10px; padding: .5rem .65rem; }
.stat-lib { font-size: .8rem; color: var(--texte-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.stat-val { font-size: 1.3rem; font-weight: 700; color: var(--nuit); font-variant-numeric: tabular-nums; }
.periode-carte { font-size: .85rem; color: var(--texte-2); margin: -.35rem 0 .7rem; }
.periode-carte + .stats + .aide, .stats + .aide { margin-bottom: 0; }
.stat-delta { font-size: .85rem; color: var(--texte-2); font-variant-numeric: tabular-nums; }
.filtre-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; margin: .5rem 0 1rem; font-weight: 600; }
.seg-boutons { display: inline-flex; background: var(--blanc); border: 1px solid var(--azur-fonce); border-radius: 22px; padding: 2px; }
.seg-boutons button { all: unset; box-sizing: border-box; min-height: 40px; min-width: 44px; padding: 0 .85rem; border-radius: 20px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: .92rem; color: var(--azur-fonce); }
.seg-boutons button[aria-pressed="true"] { background: var(--azur-fonce); color: var(--blanc); }
.seg-boutons button:focus-visible { outline: 3px solid var(--azur-fonce); outline-offset: 2px; }
.grille-graph { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); margin-bottom: 1rem; }
@media (min-width: 1100px) { .grille-graph { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.grille-graph .carte { margin-bottom: 0; min-width: 0; }
.graph { width: 100%; min-height: 60px; }
.graph svg { display: block; overflow: visible; }
.graph .grille { stroke: #E3E8EC; stroke-width: 1; }
.graph .base { stroke: #8A97A3; stroke-width: 1; }
.graph .axe { font-size: 11px; fill: var(--texte-2); font-variant-numeric: tabular-nums; }
.graph .valeur { font-size: 12px; font-weight: 600; fill: var(--texte); }
.graph .etiquette { font-size: 12px; fill: var(--texte); }
.graph .point { stroke: var(--blanc); stroke-width: 2; }
.graph .moyenne { stroke: var(--texte); stroke-width: 2; stroke-linecap: round; }
.graph .cible { fill: transparent; cursor: pointer; }
.graph .cible:hover, .graph .cible:focus { fill: rgba(56, 132, 200, .10); outline: none; }
.legende { display: flex; gap: 1rem; font-size: .85rem; color: var(--texte-2); margin-bottom: .25rem; }
.legende i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; }
.barres-h { display: flex; flex-direction: column; gap: 4px; }
.bh { display: grid; grid-template-columns: 8.5rem 1fr auto; align-items: center; gap: .5rem; min-height: 32px; border-radius: 4px; }
.bh:hover, .bh:focus { background: var(--fond-2); outline: none; }
.bh-lib { font-size: .9rem; }
.bh-piste { height: 20px; display: flex; align-items: center; }
.bh-barre { display: block; height: 20px; background: var(--serie-realise); border-radius: 0 4px 4px 0; min-width: 2px; }
.bh-val { font-size: .85rem; color: var(--texte-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
details.donnees summary { min-height: 36px; font-size: .9rem; }
table.pvr td, table.pvr th { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.pvr tr.futur td { color: var(--texte-2); }
table.pvr .sans { color: var(--texte-2); font-size: .8rem; }
table.simple td.num { white-space: nowrap; }
.jauge { display: inline-block; width: 90px; height: 10px; background: var(--azur-clair); border-radius: 5px; vertical-align: middle; overflow: hidden; }
.jauge span { display: block; height: 100%; background: var(--serie-realise); }
#infobulle { position: fixed; z-index: 60; display: none; pointer-events: none; background: var(--blanc); color: var(--texte); border: 1px solid var(--bord);
  border-radius: 6px; padding: .4rem .6rem; font-size: .85rem; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 280px; }
#infobulle .cle { display: inline-block; width: 12px; height: 2px; margin-right: .4rem; vertical-align: middle; }
#infobulle strong { font-variant-numeric: tabular-nums; }

/* ---------- Plan / calendrier ---------- */
.menu-outils { position: relative; }
.menu-outils > summary { list-style: none; color: var(--texte); }
.menu-outils > summary::-webkit-details-marker { display: none; }
.menu-outils > summary::after { content: "▾"; margin-left: .2rem; }
.menu-outils[open] > summary::after { content: "▴"; }
details.menu-outils[open] > .menu-liste { position: absolute; right: 0; top: calc(100% + 4px); z-index: 15; display: flex; flex-direction: column; gap: .35rem;
  min-width: 15rem; padding: .5rem; background: var(--blanc); border: 1px solid #DCE3EA; border-radius: 12px; box-shadow: 0 6px 20px rgba(16, 28, 72, .15); }
.menu-liste .btn { justify-content: flex-start; border-color: transparent; }
.cal-barre { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: .75rem; }
.seg-vue { width: auto; }
.seg-vue label { padding: 0 1rem; }
.cal-nav { display: flex; gap: .3rem; }
.cal-titre { font-size: 1.05rem; text-transform: capitalize; }
.banniere.deplacement { margin: 0 0 .75rem; border-color: var(--prevu); background: var(--prevu-clair); }
.totaux-sem { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: .75rem; font-size: .92rem; background: var(--blanc);

<script id="core">

  }

  function parseDateFR(v) {

    if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s))) iso = m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);

<!-- ======================================================================
     STOCKAGE : IndexedDB (repli localStorage si IndexedDB indisponible).
     Les données restent sur l'appareil.
     ====================================================================== -->
<script>
var DB = (function () {
  'use strict';
  var NOM = 'trail-acn', VERSION = 1, LS_CLE = 'trail-acn-v1';
  var COLLECTIONS = ['seances', 'courses', 'chaussures', 'vma'];
  var db = null;
  var api = {
    mode: null,
    data: { seances: [], courses: [], chaussures: [], vma: [], meta: {} },
    COLLECTIONS: COLLECTIONS
  };

  function req(r) { return new Promise(function (ok, ko) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
  function tx(stores, fn) {
    return new Promise(function (ok, ko) {
      var t = db.transaction(stores, 'readwrite');
      fn(t);
      t.oncomplete = function () { ok(); };
      t.onerror = function () { ko(t.error); };
      t.onabort = function () { ko(t.error || new Error('transaction annulée')); };
    });
  }
  function ouvrir() {
    return new Promise(function (ok, ko) {
      if (!('indexedDB' in window) || !window.indexedDB) return ko(new Error('IndexedDB indisponible'));
      var r = indexedDB.open(NOM, VERSION);
      r.onupgradeneeded = function () {
        var d = r.result;
        COLLECTIONS.forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'cle' });
      };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ko(r.error); };
      r.onblocked = function () { ko(new Error('base bloquée par un autre onglet')); };
    });
  }
  function lsEcrire() {
    localStorage.setItem(LS_CLE, JSON.stringify(api.data));
  }

  api.init = function () {
    return ouvrir().then(function (d) {
      db = d; api.mode = 'IndexedDB';
      var t = db.transaction(COLLECTIONS.concat('meta'), 'readonly');
      return Promise.all(COLLECTIONS.map(function (s) { return req(t.objectStore(s).getAll()); })
        .concat(req(t.objectStore('meta').getAll())));
    }).then(function (res) {
      COLLECTIONS.forEach(function (s, i) { api.data[s] = res[i] || []; });
      var meta = {};
      (res[COLLECTIONS.length] || []).forEach(function (m) { meta[m.cle] = m.valeur; });
      api.data.meta = meta;
    }).catch(function () {
      // Repli : localStorage (navigation privée ancienne, IndexedDB désactivé…)
      api.mode = 'localStorage';
      try {
        var brut = localStorage.getItem(LS_CLE);
        if (brut) {
          var d = JSON.parse(brut);
          COLLECTIONS.forEach(function (s) { api.data[s] = Array.isArray(d[s]) ? d[s] : []; });
          api.data.meta = d.meta && typeof d.meta === 'object' ? d.meta : {};
        }
      } catch (e) { api.mode = 'mémoire (non enregistré)'; }
    });
  };

  function majMemoire(store, obj) {
    var arr = api.data[store], i = arr.findIndex(function (x) { return x.id === obj.id; });
    if (i >= 0) arr[i] = obj; else arr.push(obj);
  }

  api.put = function (store, obj) { return api.putMany(store, [obj]); };
  api.putMany = function (store, objs) {
    var p;
    if (api.mode === 'IndexedDB') p = tx([store], function (t) { var o = t.objectStore(store); objs.forEach(function (x) { o.put(x); }); });
    else p = Promise.resolve().then(function () {
      var copie = api.data[store].slice();
      objs.forEach(function (x) { majMemoire(store, x); });
      try { if (api.mode === 'localStorage') lsEcrire(); } catch (e) { api.data[store] = copie; throw e; }
    });
    return p.then(function () { if (api.mode === 'IndexedDB') objs.forEach(function (x) { majMemoire(store, x); }); });
  };
  api.remove = function (store, id) { return api.removeMany(store, [id]); };
  api.removeMany = function (store, ids) {
    var p;
    if (api.mode === 'IndexedDB') p = tx([store], function (t) { var o = t.objectStore(store); ids.forEach(function (id) { o.delete(id); }); });
    else p = Promise.resolve();
    return p.then(function () {
      api.data[store] = api.data[store].filter(function (x) { return ids.indexOf(x.id) < 0; });
      if (api.mode === 'localStorage') lsEcrire();
    });
  };
  api.setMeta = function (cle, valeur) {
    var p = api.mode === 'IndexedDB'
      ? tx(['meta'], function (t) { t.objectStore('meta').put({ cle: cle, valeur: valeur }); })
      : Promise.resolve();
    return p.then(function () { api.data.meta[cle] = valeur; if (api.mode === 'localStorage') lsEcrire(); });
  };
  // Remplace toutes les collections (import « remplacer tout » ou effacement)
  api.replaceAll = function (data) {
    var meta = data.meta || {};
    var p = api.mode === 'IndexedDB'
      ? tx(COLLECTIONS.concat('meta'), function (t) {
          COLLECTIONS.forEach(function (s) {
            var o = t.objectStore(s); o.clear();
            (data[s] || []).forEach(function (x) { o.put(x); });
          });
          var m = t.objectStore('meta'); m.clear();
          Object.keys(meta).forEach(function (k) { m.put({ cle: k, valeur: meta[k] }); });
        })
      : Promise.resolve();
    return p.then(function () {
      COLLECTIONS.forEach(function (s) { api.data[s] = (data[s] || []).slice(); });
      api.data.meta = Object.assign({}, meta);
      if (api.mode === 'localStorage') lsEcrire();
    });
  };
  api.vide = function () { return COLLECTIONS.every(function (s) { return api.data[s].length === 0; }); };
  return api;
})();
</script>

<!-- ======================================================================
     INTERFACE
     ====================================================================== -->
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var NF = {};
  function fmt(x, d) {
    if (x == null || !isFinite(x)) return '—';
    d = d == null ? 1 : d;
    if (!NF[d]) NF[d] = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d });
    return NF[d].format(x);
  }
  function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
  }
  function maintenant() { return new Date().toISOString(); }
  function typeLabel(k) { var t = Core.TYPES.filter(function (x) { return x[0] === k; })[0]; return t ? t[1] : k; }
  var JOURS = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
  function dateLongue(iso) { return Core.isValidISODate(iso) ? JOURS[Core.dayOfWeek(iso)] + ' ' + Core.formatDateFR(iso) : '—'; }
  var CONFORMITE_LIB = { ok: 'Conforme', partiel: 'Partiel', non: 'Non conforme' };
  // Valeur affichée avec la mention « extrait » quand elle vient d'une consigne texte
  function marqueExtrait(s, champ, txt) {
    return s.extrait && s.extrait[champ] ? '<span title="Extrait de la consigne : « ' + esc(s.extrait[champ]) + ' »">≈ ' + txt + '</span>' : txt;
  }
  // Une séance est une course (compétition) si son type est « Course » ou si elle est liée à une course
  function estCompetition(s) { return !!s && (s.type === 'course' || !!s.courseId); }
  function vmaCourante() { var e = Core.currentVMA(DB.data.vma); return e ? e.valeur : null; }
  function trouver(store, id) { return id ? DB.data[store].filter(function (x) { return x.id === id; })[0] || null : null; }

  /* ---------- Notifications ---------- */
  function toast(msg, opts) {
    opts = opts || {};
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span>' + esc(msg) + '</span>';
    var fini = false;
    function fermer() { if (!fini) { fini = true; el.remove(); } }
    if (opts.action) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = opts.label || 'Annuler';
      b.addEventListener('click', function () { fermer(); opts.action(); });
      el.appendChild(b);
    }
    var pile = $('#toasts');
    while (pile.children.length >= 3) pile.firstChild.remove();
    pile.appendChild(el);
    setTimeout(fermer, opts.duree || (opts.action ? 10000 : 3500));
  }
  function erreurStockage(e) {
    toast('Échec de l\'enregistrement sur l\'appareil : ' + (e && e.message ? e.message : e));
  }

  /* ---------- Routeur ---------- */
  var ROUTES = {};
  var routeCourante = 'tableau';
  function router() {
    var r = (location.hash.replace(/^#\/?/, '') || 'tableau').split('?')[0];
    if (!ROUTES[r]) r = 'tableau';
    routeCourante = r;
    $$('.nav a').forEach(function (a) {
      if (a.getAttribute('data-route') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    ROUTES[r]($('#vue'));
    regionsDefilantes();
    bannieres();
  }
  function rafraichir() { router(); }
  // Zones à défilement horizontal : focusables et nommées (navigation au clavier, lecteurs d'écran)
  function regionsDefilantes() {
    $$('#vue .table-wrap').forEach(function (w) {
      var sec = w.closest('section'), titre = sec && sec.querySelector('h2, h3');
      w.setAttribute('tabindex', '0'); w.setAttribute('role', 'region');
      w.setAttribute('aria-label', titre ? titre.textContent : 'Tableau');
    });
  }

  /* ---------- Bannières : démo, sauvegarde ---------- */
  function bannieres() {
    var h = '';
    var demo = DB.COLLECTIONS.some(function (s) { return DB.data[s].some(function (x) { return x.demo; }); });
    if (demo) {
      h += '<div class="banniere" role="status"><span><span class="badge demo">DÉMO</span> Des données de démonstration sont chargées. Elles ne sont pas réelles.</span>' +
        '<button type="button" class="btn petit" data-action="suppr-demo">Supprimer la démo</button></div>';
    }
    if (!DB.vide()) {
      var der = DB.data.meta.derniereSauvegarde;
      var jours = der ? Core.daysBetween(Core.todayParis(new Date(der)), Core.todayParis()) : null;
      if (jours === null || jours > 14) {
        h += '<div class="banniere" role="status"><span>' +
          (jours === null ? 'Aucune sauvegarde exportée depuis cet appareil.' : 'Dernière sauvegarde il y a ' + jours + ' jours.') +
          ' Les données ne sont stockées que dans ce navigateur.</span>' +
          '<button type="button" class="btn petit primaire" data-action="exporter">Exporter maintenant</button></div>';
      }
    }
    $('#bannieres').innerHTML = h;
  }

  /* ---------- Vues provisoires (phases suivantes) ---------- */
  function vueAVenir(titre, phase, texte) {
    return function (el) {
      el.innerHTML = '<div class="vue-tete"><h2>' + esc(titre) + '</h2></div>' +
        '<div class="vide"><p><strong>Livré en phase ' + phase + '.</strong></p><p>' + esc(texte) + '</p></div>';
    };
  }

  /* =====================================================================
     JOURNAL
     ===================================================================== */
  var filtre = { q: '', type: '', statut: '', course: '', du: '', au: '', tri: 'date', sens: -1, prevuesRealisees: false };
  var TRIS = [['date', 'Date'], ['type', 'Type'], ['dureeSec', 'Durée'], ['distanceKm', 'Distance'], ['dplus', 'D+'], ['allure', 'Allure'], ['fcMoy', 'FC moy.'], ['rpe', 'RPE'], ['kmEffort', 'km-effort']];

  function seancesFiltrees() {
    var q = filtre.q.trim().toLowerCase();
    var vma = vmaCourante();
    // Une séance prévue déjà réalisée (souvent créée par l'import avec sa réalisée) fait doublon :
    // sa consigne figure déjà sur la carte de la réalisée. Masquée sauf demande explicite.
    var faites = filtre.prevuesRealisees ? {} : realisationsParPrevue();
    var liste = DB.data.seances.filter(function (s) {
      if (s.statut === 'prevue' && faites[s.id]) return false;
      if (filtre.type && s.type !== filtre.type) return false;
      if (filtre.statut && s.statut !== filtre.statut) return false;
      if (filtre.course === '-' && s.courseId) return false;
      if (filtre.course && filtre.course !== '-' && s.courseId !== filtre.course) return false;
      if (filtre.du && s.date < filtre.du) return false;
      if (filtre.au && s.date > filtre.au) return false;
      if (q) {
        var ch = trouver('chaussures', s.chaussureId), co = trouver('courses', s.courseId);
        var txt = [s.notes, typeLabel(s.type), s.intitule, s.consigne, s.profil, ch && ch.nom, co && co.nom, Core.formatDateFR(s.date), s.statut === 'prevue' ? 'prévue' : 'réalisée'].join(' ').toLowerCase();
        if (txt.indexOf(q) < 0) return false;
      }
      return true;
    }).map(function (s) { return { s: s, d: Core.derive(s, vma) }; });
    var k = filtre.tri, sens = filtre.sens;
    function val(x) {
      if (k === 'allure' || k === 'kmEffort') return x.d[k];
      if (k === 'type') return typeLabel(x.s.type);
      return x.s[k];
    }
    liste.sort(function (a, b) {
      var va = val(a), vb = val(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;              // valeurs absentes toujours en fin de liste
      if (vb == null) return -1;
      var c = (typeof va === 'string' ? va.localeCompare(vb, 'fr') : va - vb) * sens;
      // À égalité : la plus récente d'abord
      if (c === 0) c = a.s.date < b.s.date ? 1 : a.s.date > b.s.date ? -1 : 0;
      return c;
    });
    return liste;
  }

  // Séances réalisées rattachées à chaque séance prévue
  function realisationsParPrevue() {
    var m = {};
    DB.data.seances.forEach(function (s) { if (s.statut === 'realisee' && s.prevueId) (m[s.prevueId] = m[s.prevueId] || []).push(s); });
    return m;
  }

  function optionsTypes(sel, avecTous) {
    return (avecTous ? '<option value="">Tous</option>' : '') + Core.TYPES.map(function (t) {
      return '<option value="' + t[0] + '"' + (t[0] === sel ? ' selected' : '') + '>' + esc(t[1]) + '</option>';
    }).join('');
  }
  function optionsCourses(sel, libelleVide) {
    var cs = DB.data.courses.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return '<option value="">' + esc(libelleVide) + '</option>' + cs.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nom) + ' (' + Core.formatDateFR(c.date) + ', ' + c.priorite + ')' + '</option>';
    }).join('');
  }

  function filtreActif() { return !!(filtre.q || filtre.type || filtre.statut || filtre.course || filtre.du || filtre.au || filtre.prevuesRealisees); }
  // Filtres dépliés sur ordinateur, repliés sur téléphone (sauf s'ils sont actifs)
  function filtresOuverts() { return window.matchMedia('(min-width: 900px)').matches || filtreActif(); }

  ROUTES.journal = function (el) {
    el.innerHTML =
      '<div class="vue-tete"><h2>Journal des séances</h2><div class="actions">' +
      '<button type="button" class="btn primaire" data-action="nouvelle" data-statut="realisee">Nouvelle séance réalisée</button>' +
      '<button type="button" class="btn prevu" data-action="nouvelle" data-statut="prevue">Nouvelle séance prévue</button></div></div>' +
      '<details class="bloc-filtres" id="bloc-filtres"' + (filtresOuverts() ? ' open' : '') + '><summary>Filtres et tri' + (filtreActif() ? ' (actifs)' : '') + '</summary>' +
      '<form class="filtres" id="filtres" role="search" aria-label="Filtrer les séances">' +
      '<label class="large">Recherche<input type="search" name="q" value="' + esc(filtre.q) + '" placeholder="notes, type, chaussures, course…"></label>' +
      '<label>Type<select name="type">' + optionsTypes(filtre.type, true) + '</select></label>' +
      '<label>Statut<select name="statut"><option value="">Tous</option><option value="realisee"' + (filtre.statut === 'realisee' ? ' selected' : '') + '>Réalisée</option><option value="prevue"' + (filtre.statut === 'prevue' ? ' selected' : '') + '>Prévue</option></select></label>' +
      '<label>Course liée<select name="course">' + optionsCourses(filtre.course, 'Toutes').replace('<option value="">Toutes</option>', '<option value="">Toutes</option><option value="-"' + (filtre.course === '-' ? ' selected' : '') + '>Sans course</option>') + '</select></label>' +
      '<label>Du<input type="date" name="du" value="' + esc(filtre.du) + '"></label>' +
      '<label>Au<input type="date" name="au" value="' + esc(filtre.au) + '"></label>' +
      '<label class="large case"><input type="checkbox" name="prevuesRealisees"' + (filtre.prevuesRealisees ? ' checked' : '') + '> Afficher aussi les séances prévues déjà réalisées</label>' +
      '<div class="boutons"><label class="visuel-masque" for="f-tri">Trier par</label>' +
      '<select id="f-tri" name="tri" style="width:auto">' + TRIS.map(function (t) { return '<option value="' + t[0] + '"' + (t[0] === filtre.tri ? ' selected' : '') + '>Tri : ' + t[1] + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn discret" data-action="sens" id="b-sens"></button>' +
      '<button type="button" class="btn discret" data-action="raz-filtres">Réinitialiser les filtres</button></div>' +
      '</form></details>' +
      '<p class="resume" id="j-resume" aria-live="polite"></p>' +
      '<div id="j-liste"></div>';
    var f = $('#filtres');
    f.addEventListener('submit', function (e) { e.preventDefault(); });
    f.addEventListener('input', function (e) {
      var n = e.target.name;
      if (n && n in filtre) { filtre[n] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; listeJournal(); }
    });
    listeJournal();
  };

  function listeJournal() {
    var liste = seancesFiltrees();
    var realisees = liste.filter(function (x) { return x.s.statut === 'realisee'; }).map(function (x) { return x.s; });
    var prevues = liste.length - realisees.length;
    var t = Core.totals(realisees);
    $('#b-sens').textContent = filtre.sens < 0 ? 'Ordre : décroissant' : 'Ordre : croissant';
    var faites = realisationsParPrevue();
    var masquees = filtre.prevuesRealisees ? 0 : DB.data.seances.filter(function (s) { return s.statut === 'prevue' && faites[s.id]; }).length;
    $('#j-resume').textContent = liste.length + ' séance(s) affichée(s) dont ' + prevues + ' prévue(s). Réalisées affichées : ' +
      fmt(t.km, 2) + ' km, ' + fmt(t.dplus, 0) + ' m D+, ' + Core.formatDuration(t.dureeSec) + ', ' + fmt(t.kmEffort, 1) + ' km-effort.' +
      (masquees ? ' ' + masquees + ' séance(s) prévue(s) déjà réalisée(s) masquée(s) (leur consigne est sur la séance réalisée).' : '');
    if (!DB.data.seances.length) {
      $('#j-liste').innerHTML = '<div class="vide"><p>Aucune séance enregistrée.</p><p>Ajoute ta première séance avec « + Séance », importe une sauvegarde depuis l\'onglet Données, ou charge des données de démo.</p></div>';
      return;
    }
    if (!liste.length) { $('#j-liste').innerHTML = '<div class="vide">Aucune séance ne correspond aux filtres.</div>'; return; }
    var reals = realisationsParPrevue();

    function etat(s) {
      if (s.statut === 'prevue') {
        var r = reals[s.id];
        return '<span class="badge prevu">Prévue</span>' + (r ? ' <span class="aide">réalisée le ' + r.map(function (x) { return Core.formatDateFR(x.date); }).join(', ') + '</span>' : '');
      }
      return '<span class="badge realise">Réalisée</span>' + (s.conformite ? ' <span class="aide">' + CONFORMITE_LIB[s.conformite] + '</span>' : '');
    }
    function actions(s, compact) {
      var h = '';
      if (compact) {
        if (s.statut === 'prevue' && !reals[s.id]) h += '<button type="button" class="btn petit prevu" data-action="realiser" data-id="' + esc(s.id) + '">Réaliser</button>';
        return h + '<button type="button" class="btn petit" data-action="modifier" data-id="' + esc(s.id) + '">Modifier</button>';
      }
      if (s.statut === 'prevue' && !reals[s.id]) h += '<button type="button" class="btn petit prevu" data-action="realiser" data-id="' + esc(s.id) + '">Réaliser</button>';
      h += '<button type="button" class="btn petit" data-action="modifier" data-id="' + esc(s.id) + '">Modifier</button>' +
        '<button type="button" class="btn petit discret" data-action="dupliquer" data-id="' + esc(s.id) + '">Dupliquer</button>' +
        '<button type="button" class="btn petit discret" data-action="supprimer" data-id="' + esc(s.id) + '">Supprimer</button>';
      return h;
    }
    function th(cle, lib, num) {

      }).join('') + '</select><span class="aide">Rapprochement prévu / réalisé.</span></label>' +

      '</div></form>';

    var box = dlg();
    box.innerHTML = html;
    var f = $('#f-seance', box);

    function lire() {
      var err = [], champs = [];
      function num(nom, lib, entier) {
        var x = Core.parseNumberFR(f.elements[nom].value);
        if (x !== null && (isNaN(x) || x < 0 || (entier && Math.round(x) !== x))) { err.push(lib + ' : valeur non reconnue'); champs.push(nom); return undefined; }
        return x;
      }
      var hv = num('h', 'Heures', true), mv = num('m', 'Minutes', true), sv = num('s', 'Secondes', true);
      if (mv != null && mv > 59) { err.push('Minutes : 0 à 59'); champs.push('m'); }
      if (sv != null && sv > 59) { err.push('Secondes : 0 à 59'); champs.push('s'); }
      var statut = (f.querySelector('input[name="statut"]:checked') || {}).value;
      var typeSel = f.elements.type.value;
      var dureeSec = null;
      if (hv === null && mv === null && sv === null) { if (statut === 'realisee') { err.push('Durée obligatoire pour une séance réalisée'); champs.push('h', 'm', 's'); } }
      else if (hv !== undefined && mv !== undefined && sv !== undefined) dureeSec = Core.hmsToSec(hv, mv, sv);
      var dist = num('distance', 'Distance');
      if (dist === null && statut === 'realisee' && Core.TYPES_SANS_DISTANCE.indexOf(typeSel) < 0) { err.push('Distance obligatoire pour une séance réalisée (saisir 0 si besoin)'); champs.push('distance'); }
      var fc = num('fc', 'FC moyenne', true);
      var dp = num('dplus', 'D+');
      var rpe = num('rpe', 'RPE');
      if (rpe != null && rpe > 10) { err.push('RPE : 0 à 10'); champs.push('rpe'); }
      var r = (f.querySelector('input[name="ressenti"]:checked') || {}).value;
      var obj = Object.assign({}, s, {
        statut: statut, date: f.elements.date.value, type: f.elements.type.value,
        dureeSec: dureeSec, distanceKm: dist === undefined ? null : dist,
        fcMoy: fc === undefined ? null : fc, dplus: dp === undefined ? null : dp,
        ressenti: r ? Number(r) : null,
        chaussureId: f.elements.chaussure.value || null, courseId: f.elements.course.value || null,
        prevueId: statut === 'realisee' ? (f.elements.prevue.value || null) : null,
        notes: f.elements.notes.value.trim(),
        rpe: rpe === undefined ? null : rpe, intensite: f.elements.intensite.value ? Number(f.elements.intensite.value) : null,
        conformite: f.elements.conformite.value || null, profil: f.elements.profil.value.trim(), capteur: f.elements.capteur.value.trim(),
        intitule: f.elements.intitule.value.trim(), consigne: f.elements.consigne.value.trim()
      });
      // Une valeur extraite de la consigne et modifiée à la main n'est plus « extraite »
      if (s.extrait) {
        var ex = Object.assign({}, s.extrait);
        if (ex.dureeSec && obj.dureeSec !== s.dureeSec) delete ex.dureeSec;
        if (ex.distanceKm && obj.distanceKm !== s.distanceKm) delete ex.distanceKm;
        obj.extrait = (ex.dureeSec || ex.distanceKm) ? ex : null;
      }
      if (!Core.isValidISODate(obj.date)) { err.push('Date invalide'); champs.push('date'); }
      if (obj.fcMoy != null && (obj.fcMoy <= 0 || obj.fcMoy > 260)) { err.push('FC moyenne : 1 à 260 bpm'); champs.push('fc'); }
      return { obj: obj, err: err, champs: champs };
    }
    function majCalcules() {
      var r = lire(), o = r.obj, vma = vmaCourante();
      var dv = Core.derive({ dureeSec: o.dureeSec, distanceKm: o.distanceKm, dplus: o.dplus }, vma);
      $('#calcules', box).innerHTML =
        '<span>Allure <b>' + Core.formatPace(dv.allure) + '</b></span>' +
        '<span>Vitesse <b>' + (dv.vitesse == null ? '—' : fmt(dv.vitesse, 2) + ' km/h') + '</b></span>' +
        '<span>km-effort <b>' + (dv.kmEffort == null ? '—' : fmt(dv.kmEffort, 1)) + '</b></span>' +
        '<span>% VMA moyen <b>' + (vma == null ? 'VMA non renseignée' : (dv.pctVma == null ? '—' : fmt(dv.pctVma, 0) + ' %')) + '</b></span>';
      $('#l-prevue', box).hidden = o.statut !== 'realisee';
      $('#aide-oblig', box).textContent = o.statut === 'prevue' ? 'Séance prévue : durée et distance facultatives.'
        : (Core.TYPES_SANS_DISTANCE.indexOf(o.type) >= 0 ? 'Renfo : distance facultative.' : '');
    }
    f.addEventListener('input', function (e) {
      // Passage automatique au champ suivant quand minutes / secondes sont complètes
      var n = e.target.name;
      if ((n === 'm' || n === 's') && /^\d{2}$/.test(e.target.value)) {
        var suivant = n === 'm' ? f.elements.s : f.elements.distance;
        suivant.focus(); if (suivant.select) suivant.select();
      }
      e.target.removeAttribute('aria-invalid');
      majCalcules();
    });
    f.addEventListener('change', majCalcules);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var r = lire();
      $$('[aria-invalid]', f).forEach(function (x) { x.removeAttribute('aria-invalid'); });
      if (!r.err.length) {
        var verif = Core.validateSeance(r.obj);
        verif.forEach(function (m) { r.err.push(m.charAt(0).toUpperCase() + m.slice(1)); });
      }
      if (r.err.length) {
        $('#erreurs', box).innerHTML = 'À corriger :<ul>' + r.err.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        r.champs.forEach(function (c) { if (f.elements[c]) f.elements[c].setAttribute('aria-invalid', 'true'); });
        if (r.champs.length && f.elements[r.champs[0]]) f.elements[r.champs[0]].focus();
        return;
      }
      var o = r.obj, nouveau = !o.id;
      if (nouveau) { o.id = uid(); o.creeLe = maintenant(); o.source = o.source || 'manuelle'; }
      o.modifieLe = maintenant();
      DB.put('seances', o).then(function () {
        fermerDialogue();
        toast(nouveau ? (o.statut === 'prevue' ? 'Séance prévue enregistrée.' : 'Séance enregistrée.') : 'Séance modifiée.');
        rafraichir();
      }).catch(erreurStockage);
    });
    if (!box.open) box.showModal();
    majCalcules();
    if (mode === 'creer') {
      var cible = f.elements.h.value === '' ? f.elements.h : f.elements.distance;
      cible.focus();
    }
  }

  /* =====================================================================
     DONNÉES : export / import JSON, démo, effacement
     ===================================================================== */
  function telecharger(nom, contenu, type) {
    var blob = new Blob([contenu], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  var REGLAGES_EXPORTES = ['zones', 'semaineType', 'profilsImport', 'stravaConfig'];
  function exporterJSON() {
    var meta = Object.assign({}, DB.data.meta);
    delete meta.derniereSauvegarde;
    var paquet = {
      // Identifiant technique conservé tel quel (ancien nom) : les sauvegardes déjà exportées restent importables
      application: 'suivi-trail-acn-anduze', schema: Core.SCHEMA_VERSION, exporteLe: maintenant(),
      donnees: { seances: DB.data.seances, courses: DB.data.courses, chaussures: DB.data.chaussures, vma: DB.data.vma, parametres: meta.parametres || {},
        // Réglages transférables entre appareils. Les jetons Strava (meta.strava) restent propres à chaque appareil et ne sont jamais exportés.
        reglages: REGLAGES_EXPORTES.reduce(function (acc, k) { if (meta[k] != null) acc[k] = meta[k]; return acc; }, {}) }
    };
    telecharger('my-running-lab-sauvegarde-' + Core.todayParis() + '.json', JSON.stringify(paquet, null, 2), 'application/json');
    DB.setMeta('derniereSauvegarde', maintenant()).then(function () { toast('Sauvegarde exportée.'); rafraichir(); }).catch(erreurStockage);
  }

  // Analyse un fichier de sauvegarde ; ne modifie rien. Renvoie les éléments valides et les rejets motivés.
  function analyserSauvegarde(texte) {
    var p;
    try { p = JSON.parse(texte); } catch (e) { return { erreur: 'Fichier illisible : ce n\'est pas du JSON valide.' }; }
    if (!p || p.application !== 'suivi-trail-acn-anduze' || !p.donnees) return { erreur: 'Ce fichier n\'est pas une sauvegarde de cet outil.' };
    if (typeof p.schema !== 'number' || p.schema > Core.SCHEMA_VERSION) return { erreur: 'Sauvegarde créée par une version plus récente de l\'outil (schéma ' + p.schema + ').' };
    var valid = { seances: Core.validateSeance, courses: Core.validateCourse, chaussures: Core.validateChaussure, vma: Core.validateVMA };
    var LIB = { seances: 'Séance', courses: 'Course', chaussures: 'Chaussure', vma: 'VMA' };
    var res = { exporteLe: p.exporteLe, ok: {}, rejets: [], parametres: p.donnees.parametres && typeof p.donnees.parametres === 'object' ? p.donnees.parametres : {}, reglages: {} };
    var rg = p.donnees.reglages && typeof p.donnees.reglages === 'object' ? p.donnees.reglages : {};
    REGLAGES_EXPORTES.forEach(function (k) { if (rg[k] != null) res.reglages[k] = rg[k]; });
    DB.COLLECTIONS.forEach(function (s) {
      res.ok[s] = [];
      var arr = p.donnees[s];
      if (arr == null) return;
      if (!Array.isArray(arr)) { res.rejets.push({ quoi: LIB[s], motif: 'section illisible' }); return; }
      var vus = {};
      arr.forEach(function (x, i) {
        var e = valid[s](x);
        if (!e.length && (!x.id || typeof x.id !== 'string')) e = ['identifiant manquant'];
        if (!e.length && vus[x.id]) e = ['identifiant en double dans le fichier'];
        if (e.length) res.rejets.push({ quoi: LIB[s] + ' n° ' + (i + 1) + (x && x.date ? ' (' + Core.formatDateFR(x.date) + ')' : ''), motif: e.join(', ') });
        else { vus[x.id] = 1; res.ok[s].push(x); }
      });
    });
    return res;
  }

  function appliquerImport(an, mode) {
    var p;
    if (mode === 'remplacer') {
      var meta = Object.assign({ parametres: an.parametres }, an.reglages);
      // Conservés sur l'appareil : date de dernière sauvegarde et connexion Strava
      if (DB.data.meta.derniereSauvegarde) meta.derniereSauvegarde = DB.data.meta.derniereSauvegarde;
      if (DB.data.meta.strava) meta.strava = DB.data.meta.strava;
      p = DB.replaceAll({ seances: an.ok.seances, courses: an.ok.courses, chaussures: an.ok.chaussures, vma: an.ok.vma, meta: meta });
    } else {
      p = DB.COLLECTIONS.reduce(function (acc, s) {
        return acc.then(function () { return an.ok[s].length ? DB.putMany(s, an.ok[s]) : null; });
      }, Promise.resolve()).then(function () {
        var actuels = DB.data.meta.parametres || {};
        var fusion = Object.assign({}, an.parametres, actuels);
        Object.keys(actuels).forEach(function (k) { if (actuels[k] == null) fusion[k] = an.parametres[k]; });
        return DB.setMeta('parametres', fusion);
      }).then(function () {
        // Fusion : un réglage du fichier n'est repris que s'il n'existe pas encore sur cet appareil
        return REGLAGES_EXPORTES.reduce(function (acc, k) {
          var local = DB.data.meta[k], vide = local == null || (Array.isArray(local) && !local.length) || (typeof local === 'object' && !Array.isArray(local) && !Object.keys(local).length);
          return acc.then(function () { return an.reglages[k] != null && vide ? DB.setMeta(k, an.reglages[k]) : null; });
        }, Promise.resolve());
      });
    }
    return p;
  }

      function signalerIgnoree(raison) {
        var nb = valeurCol(row, 'notes'), coms = [];
        if (imp.format === 'xlsx') imp.colonnes.forEach(function (c) { var t = f.commentaires[l.r + ',' + c.i]; if (t) coms.push('commentaire ' + c.lettre + num + ' : ' + t); });
        if (nb != null && String(nb).trim() !== '') coms.unshift('notes : ' + String(nb).trim());
        if (coms.length) res.avert.push({ ligne: num, motif: 'ligne ignorée (' + raison + ') mais non vide — ' + coms.join(' ; ') });
      }
      if (o.depuis && date < o.depuis) { res.ignores.avant++; signalerIgnoree('avant la date de début'); return; }
      var typeBrut = valeurCol(row, 'type'); typeBrut = typeBrut == null ? '' : String(typeBrut).trim();
      var type = imp.valeursTypes[typeBrut];
      if (type === 'ignorer') { res.ignores.types[typeBrut || '(vide)'] = (res.ignores.types[typeBrut || '(vide)'] || 0) + 1; signalerIgnoree('type « ' + (typeBrut || 'vide') + ' »'); return; }
      if (!type) { res.rejets.push({ ligne: num, motif: 'type « ' + typeBrut + ' » non associé' }); return; }
      if (repris) res.datesReprises.push(num);

      var erreurs = [], avert = [], notesSup = [];
      var brut = function (champ) { var v = valeurCol(row, champ); return v == null ? '' : String(v).trim(); };
      // Champs essentiels : une valeur illisible rejette la ligne
      var duree = Core.parseDureeImport(valeurCol(row, 'dureeSec'), imp.formatDuree);
      if (Number.isNaN(duree)) erreurs.push('durée (' + lettre('dureeSec') + ') illisible : « ' + brut('dureeSec') + ' »');
      var distBrute = valeurCol(row, 'distanceKm'), dist = Core.parseNumberFR(distBrute);
      if (Number.isNaN(dist) || (dist != null && dist < 0)) { erreurs.push('distance (' + lettre('distanceKm') + ') illisible : « ' + brut('distanceKm') + ' »'); dist = NaN; }
      else if (dist != null && imp.uniteDistance === 'm') dist = dist / 1000;
      // Champs secondaires : une valeur illisible est signalée et conservée en note
      function secondaire(champ, parse, valide) {
        var b = valeurCol(row, champ);
        if (b == null || String(b).trim() === '') return null;
        var v = parse(b);
        if (v == null || Number.isNaN(v) || v === undefined || (valide && !valide(v))) {
          avert.push({ ligne: num, motif: LIB_CHAMP[champ] + ' non reconnu(e) : « ' + String(b).trim() + ' » (conservé dans les notes)' });
          notesSup.push('[' + LIB_CHAMP[champ] + ' non reconnu(e) : ' + String(b).trim() + ']');
          return null;
        }
        return v;
      }
      var dplus = secondaire('dplus', Core.parseNumberFR, function (v) { return v >= 0; });
      var fc = secondaire('fcMoy', Core.parseNumberFR, function (v) { return v > 0 && v <= 260; });
      var rpe = secondaire('rpe', Core.parseNumberFR, function (v) { return v >= 0 && v <= 10; });
      var intensite = secondaire('intensite', Core.parseIntensite);
      var ressenti = secondaire('ressenti', Core.parseNumberFR, function (v) { return [1, 2, 3, 4, 5].indexOf(v) >= 0; });
      var conformite = secondaire('conformite', Core.parseConformite);
      var statut = null;
      if (brut('statut')) {
        var ns = normaliser(brut('statut'));
        statut = /^(realisee?|fait|done|oui)$/.test(ns) ? 'realisee' : /^(prevue?|planned|a faire)$/.test(ns) ? 'prevue' : null;
        if (!statut) erreurs.push('statut illisible : « ' + brut('statut') + ' »');
      }
      if (erreurs.length) { res.rejets.push({ ligne: num, motif: erreurs.join(' ; ') }); return; }
      if (!statut) statut = (duree != null || dist != null) ? 'realisee' : 'prevue';
      var chBrut = brut('chaussure'), chaussureId = null;
      if (chBrut) { var cm = imp.valeursChaussures[chBrut]; chaussureId = cm === 'ignorer' || !cm ? null : cm === 'creer' ? 'creer:' + chBrut : cm; }
      var capteur = brut('capteur') ? (imp.valeursCapteur[brut('capteur')] != null ? imp.valeursCapteur[brut('capteur')] : brut('capteur')) : '';
      var intitule = brut('intitule') || (typeBrut && normaliser(typeBrut) !== normaliser(Core.TYPES.filter(function (x) { return x[0] === type; })[0][1]) ? typeBrut : '');
      var consigne = brut('consigne');
      var commentaires = [];
      if (o.commentaires && imp.format === 'xlsx') {
        imp.colonnes.forEach(function (c) { var t = f.commentaires[l.r + ',' + c.i]; if (t) commentaires.push('Commentaire (' + c.lettre + num + ') : ' + t); });
      }
      rangs[date] = (rangs[date] || 0) + 1;
      var cle = prefixe + date + '#' + rangs[date];
      var commun = { date: date, type: type, intitule: intitule, consigne: consigne, profil: brut('profil'), source: o.source, importCle: cle, ligneSource: num };
      var notes = [brut('notes')].concat(notesSup).filter(Boolean).join('\n');
      var prevue = null, realisee = null;
      if (statut === 'realisee') {
        realisee = Object.assign({}, commun, { statut: 'realisee', importRole: 'realisee', dureeSec: duree, distanceKm: dist, dplus: dplus, fcMoy: fc, rpe: rpe, intensite: intensite,
          ressenti: ressenti, conformite: conformite, capteur: capteur, chaussureId: chaussureId, notes: notes });
        if (o.prevueLiee && (consigne || brut('intitule'))) prevue = Object.assign({}, commun, { statut: 'prevue', importRole: 'prevue', dureeSec: null, distanceKm: null, notes: commentaires.join('\n') });
        else if (commentaires.length) realisee.notes = [realisee.notes].concat(commentaires).filter(Boolean).join('\n');
      } else {
        prevue = Object.assign({}, commun, { statut: 'prevue', importRole: 'prevue', dureeSec: duree, distanceKm: dist, dplus: dplus, fcMoy: fc, rpe: rpe, intensite: intensite,
          conformite: conformite, capteur: capteur, chaussureId: chaussureId, notes: [notes].concat(commentaires).filter(Boolean).join('\n') });
      }
      if (prevue && o.extraire && prevue.dureeSec == null && prevue.distanceKm == null) {
        var ex = Core.extraireConsigne(consigne || brut('intitule'));
        var extrait = {};
        if (ex.dureeSec != null) { prevue.dureeSec = ex.dureeSec; extrait.dureeSec = ex.dureeTexte; }
        if (ex.distanceKm != null) { prevue.distanceKm = ex.distanceKm; extrait.distanceKm = ex.distanceTexte; }
        if (extrait.dureeSec || extrait.distanceKm) { prevue.extrait = extrait; res.extraites.push({ ligne: num, texte: [extrait.dureeSec, extrait.distanceKm].filter(Boolean).join(', ') }); }
        else res.nonExtraites[ex.motifDuree] = (res.nonExtraites[ex.motifDuree] || 0) + 1;
      }
      [prevue, realisee].forEach(function (x) {
        if (!x) return;
        var e = Core.validateSeance(Object.assign({}, x, { chaussureId: null }));
        if (e.length) { res.rejets.push({ ligne: num, motif: (x.statut === 'prevue' ? 'séance prévue : ' : '') + e.join(', ') }); x.rejete = true; }
      });
      if (realisee && realisee.rejete) return;
      if (prevue && !prevue.rejete) res.recs.push(prevue);
      if (realisee) { realisee.lienPrevue = prevue && !prevue.rejete ? prevue : null; res.recs.push(realisee); }
      avert.forEach(function (a) { res.avert.push(a); });
    });

    // Comparaison avec les séances déjà présentes
    var existants = {};
    DB.data.seances.forEach(function (s) { if (s.importCle && s.importCle.indexOf(prefixe) === 0) existants[s.importCle + '|' + s.importRole] = s; });
    var vus = {};
    res.nouvelles = []; res.modifiees = []; res.identiques = 0; res.doublons = [];
    var CHAMPS_CMP = ['statut', 'date', 'type', 'dureeSec', 'distanceKm', 'dplus', 'fcMoy', 'rpe', 'intensite', 'ressenti', 'conformite', 'profil', 'capteur', 'intitule', 'consigne', 'notes'];
    var gere = CHAMPS_CMP.filter(function (c) { return ['statut', 'date', 'type'].indexOf(c) >= 0 || (imp.mapping[c] !== '' && imp.mapping[c] != null) || c === 'notes' || c === 'intitule' || (c === 'dureeSec' || c === 'distanceKm'); });
    res.recs.forEach(function (rec) {
      var ex = existants[rec.importCle + '|' + rec.importRole];
      if (ex) {
        vus[ex.id] = 1; rec.id = ex.id;
        var diffs = gere.filter(function (c) { var a = ex[c] == null ? '' : ex[c], b = rec[c] == null ? '' : rec[c]; return String(a) !== String(b); });
        var chEx = ex.chaussureId || null, chNv = rec.chaussureId && rec.chaussureId.indexOf('creer:') === 0 ? rec.chaussureId : rec.chaussureId || null;
        if ((imp.mapping.chaussure !== '' && imp.mapping.chaussure != null) && chEx !== chNv) diffs.push('chaussureId');
        if (diffs.length) res.modifiees.push({ rec: rec, ex: ex, champs: diffs, appliquer: true });
        else res.identiques++;
      } else {
        rec.id = uid();
        res.nouvelles.push(rec);
      }
    });
    // Séance réalisée déjà importée dont la prévue liée n'existe plus (supprimée à la main) :
    // ne pas recréer cette prévue, sinon elle réapparaît comme « non faite » à chaque réimport.
    res.recs.forEach(function (rec) {
      if (rec.statut !== 'realisee' || !rec.lienPrevue || !existants[rec.importCle + '|realisee']) return;
      if (res.nouvelles.indexOf(rec.lienPrevue) >= 0) {
        res.nouvelles.splice(res.nouvelles.indexOf(rec.lienPrevue), 1);
        rec.lienPrevue = null;
      }
    });
    res.recs.forEach(function (rec) { if (rec.lienPrevue) rec.prevueId = rec.lienPrevue.id; });
    // Doublons : séance réalisée nouvelle vs séance réalisée existante hors de cette source
    res.nouvelles.forEach(function (rec) {
      if (rec.statut !== 'realisee') return;
      var d = DB.data.seances.filter(function (s) {
        return s.statut === 'realisee' && !(s.importCle && s.importCle.indexOf(prefixe) === 0) && (Core.isDoublon(rec, s) || (rec.prevueId && s.prevueId === rec.prevueId));
      })[0];
      if (d) res.doublons.push({ rec: rec, ex: d });
    });
    res.absentes = Object.keys(existants).map(function (k) { return existants[k]; }).filter(function (s) { return !vus[s.id]; });
    res.choixDoublons = 'ignorer';
    imp.analyse = res;
    rendreAnalyse();
  }

  function libValeur(c, v) {
    if (v == null || v === '') return '—';
    if (c === 'dureeSec') return Core.formatDuration(v);
    if (c === 'type') return typeLabel(v);
    if (c === 'statut') return v === 'prevue' ? 'prévue' : 'réalisée';
    if (c === 'date') return Core.formatDateFR(v);
    if (c === 'conformite') return CONFORMITE_LIB[v] || v;
    if (c === 'chaussureId') { var ch = trouver('chaussures', v); return ch ? ch.nom : String(v).replace(/^creer:/, '(nouvelle) '); }
    var t = typeof v === 'number' ? fmt(v, 2) : String(v);
    return t.length > 60 ? t.slice(0, 60) + '…' : t;
  }

  function rendreAnalyse() {
    var a = imp.analyse, z = $('#imp-resultat');
    if (!a || !z) return;
    var nvR = a.nouvelles.filter(function (r) { return r.statut === 'realisee'; }), nvP = a.nouvelles.length - nvR.length;
    var tousR = a.recs.filter(function (r) { return r.statut === 'realisee'; });
    var t = Core.totals(tousR);
    var ign = Object.keys(a.ignores.types).map(function (k) { return a.ignores.types[k] + ' « ' + k + ' »'; });
    var liste = function (arr, f) { return '<ul>' + arr.map(function (x) { return '<li>' + f(x) + '</li>'; }).join('') + '</ul>'; };
    var h = '<div class="carte" style="margin-top:1rem" role="status"><h3>Aperçu (rien n\'est encore enregistré)</h3>' +
      '<p><strong>Lu dans le fichier :</strong> ' + tousR.length + ' séance(s) réalisée(s) et ' + (a.recs.length - tousR.length) + ' séance(s) prévue(s). ' +
      'Total des réalisées : ' + fmt(t.km, 2) + ' km, ' + fmt(t.dplus, 0) + ' m D+, ' + Core.formatDuration(t.dureeSec) + '.</p>' +
      '<p><strong>Ignoré :</strong> ' + [a.ignores.vides + ' ligne(s) vide(s)', a.ignores.avant + ' ligne(s) avant le ' + Core.formatDateFR(imp.options.depuis)].concat(ign).join(', ') + '.</p>' +
      (a.datesReprises.length ? '<p>Date reprise de la cellule fusionnée ou de la ligne précédente : lignes ' + a.datesReprises.join(', ') + '.</p>' : '') +
      '<details' + (a.rejets.length ? ' open' : '') + '><summary>Lignes rejetées : ' + a.rejets.length + '</summary>' + (a.rejets.length ? liste(a.rejets, function (r) { return 'Ligne ' + r.ligne + ' : ' + esc(r.motif); }) : '<p>Aucune.</p>') + '</details>' +
      '<details><summary>Avertissements : ' + a.avert.length + '</summary>' + (a.avert.length ? liste(a.avert, function (r) { return 'Ligne ' + r.ligne + ' : ' + esc(r.motif); }) : '<p>Aucun.</p>') + '</details>' +
      '<details><summary>Valeurs prévues extraites des consignes : ' + a.extraites.length + '</summary>' +
      (a.extraites.length ? liste(a.extraites, function (r) { return 'Ligne ' + r.ligne + ' : « ' + esc(r.texte) + ' »'; }) : '') +
      (Object.keys(a.nonExtraites).length ? '<p>Non extraites : ' + Object.keys(a.nonExtraites).map(function (k) { return a.nonExtraites[k] + ' (' + esc(k) + ')'; }).join(', ') + '.</p>' : '') + '</details>' +
      '<h3>Comparaison avec les données de cet appareil</h3>' +
      '<p>Nouvelles : ' + nvR.length + ' réalisée(s), ' + nvP + ' prévue(s). Identiques (déjà importées) : ' + a.identiques + '. Modifiées depuis le dernier import : ' + a.modifiees.length + '. Absentes du fichier : ' + a.absentes.length + '.</p>';
    if (a.modifiees.length) {
      h += '<details open><summary>Modifications à appliquer (' + a.modifiees.length + ')</summary><ul>' + a.modifiees.map(function (m, i) {
        return '<li><label style="flex-direction:row;align-items:flex-start;gap:.5rem;font-weight:400"><input type="checkbox" data-imp-modif="' + i + '"' + (m.appliquer ? ' checked' : '') + '><span>' +
          Core.formatDateFR(m.rec.date) + ' (' + (m.rec.statut === 'prevue' ? 'prévue' : 'réalisée') + ', ligne ' + m.rec.ligneSource + ') : ' +
          m.champs.map(function (c) { return esc(LIB_CHAMP[c] || c) + ' ' + esc(libValeur(c, m.ex[c])) + ' → ' + esc(libValeur(c, m.rec[c])); }).join(' ; ') + '</span></label></li>';
      }).join('') + '</ul></details>';
    }
    if (a.absentes.length) {
      h += '<details><summary>Séances déjà importées de cette source mais absentes du fichier (' + a.absentes.length + ')</summary><p class="aide">Conservées par défaut. Coche celles à supprimer.</p><ul>' + a.absentes.map(function (s, i) {
        return '<li><label style="flex-direction:row;align-items:center;gap:.5rem;font-weight:400"><input type="checkbox" data-imp-absente="' + i + '"' + (s.supprimer ? ' checked' : '') + '>' + dateLongue(s.date) + ' — ' + esc(typeLabel(s.type)) + ' (' + (s.statut === 'prevue' ? 'prévue' : 'réalisée') + ')</label></li>';
      }).join('') + '</ul></details>';
    }
    if (a.doublons.length) {
      h += '<details open><summary>Doublons possibles avec des séances existantes (' + a.doublons.length + ')</summary><p class="aide">Même date, distance et durée à ±1 %, ou même séance prévue liée.</p><ul>' + a.doublons.map(function (d) {
        return '<li>' + dateLongue(d.rec.date) + ' : fichier ' + fmt(d.rec.distanceKm, 2) + ' km / ' + Core.formatDuration(d.rec.dureeSec) + ' — existante ' + fmt(d.ex.distanceKm, 2) + ' km / ' + Core.formatDuration(d.ex.dureeSec) + ' (' + esc(d.ex.source || '') + ')</li>';
      }).join('') + '</ul><fieldset><legend>Pour ces doublons</legend>' +
        [['ignorer', 'Ignorer la ligne du fichier'], ['remplacer', 'Remplacer la séance existante'], ['garder', 'Garder les deux']].map(function (o) {
          return '<label style="flex-direction:row;align-items:center;gap:.5rem;font-weight:400"><input type="radio" name="imp-doublons" value="' + o[0] + '"' + (a.choixDoublons === o[0] ? ' checked' : '') + '> ' + o[1] + '</label>';
        }).join('') + '</fieldset></details>';
    }
    h += '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem"><button type="button" class="btn primaire" id="imp-appliquer">Appliquer l\'import</button></div></div>';
    z.innerHTML = h;
  }

  function appliquerImportTableau() {
    var a = imp.analyse;
    var aEcrire = [], aSupprimer = [], nouvellesPaires = {}, rapport = { creees: 0, modifiees: 0, supprimees: 0, doublonsIgnores: 0, doublonsRemplaces: 0, paires: [] };
    var doublonDe = {};
    a.doublons.forEach(function (d) { doublonDe[d.rec.id] = d.ex; });
    function resoudreChaussure(rec) {
      if (rec.chaussureId && rec.chaussureId.indexOf('creer:') === 0) {
        var nom = rec.chaussureId.slice(6);
        if (!nouvellesPaires[nom]) {
          var exist = DB.data.chaussures.filter(function (c) { return normaliser(c.nom) === normaliser(nom); })[0];
          nouvellesPaires[nom] = exist || { id: uid(), nom: nom, kmDepart: 0, kmMax: null, retiree: false };
          if (!exist) rapport.paires.push(nom);
        }
        rec.chaussureId = nouvellesPaires[nom].id;
      }
    }
    function propre(rec) {
      var o = Object.assign({}, rec);
      delete o.lienPrevue; delete o.rejete; delete o.ligneSource;
      if (!o.extrait) o.extrait = null;
      o.modifieLe = maintenant();
      return o;
    }
    a.nouvelles.forEach(function (rec) {
      var ex = doublonDe[rec.id];
      if (ex) {
        if (a.choixDoublons === 'ignorer') { rapport.doublonsIgnores++; return; }
        if (a.choixDoublons === 'remplacer') { aSupprimer.push(ex.id); rapport.doublonsRemplaces++; }
      }
      resoudreChaussure(rec);
      var o = propre(rec); o.creeLe = maintenant();
      aEcrire.push(o); rapport.creees++;
    });
    a.modifiees.forEach(function (m) {
      if (!m.appliquer) return;
      resoudreChaussure(m.rec);
      var o = Object.assign({}, m.ex);
      m.champs.concat(['prevueId', 'extrait', 'source', 'importCle', 'importRole', 'chaussureId']).forEach(function (c) { if (c in m.rec) o[c] = m.rec[c]; });
      aEcrire.push(propre(o)); rapport.modifiees++;
    });
    a.absentes.forEach(function (s) { if (s.supprimer) { aSupprimer.push(s.id); rapport.supprimees++; } });
    var paires = Object.keys(nouvellesPaires).map(function (k) { return nouvellesPaires[k]; }).filter(function (c) { return !trouver('chaussures', c.id); });
    var profils = Object.assign({}, DB.data.meta.profilsImport || {});
    profils[imp.signature] = { mapping: imp.mapping, formatDuree: imp.formatDuree, uniteDistance: imp.uniteDistance, valeursTypes: imp.valeursTypes,
      valeursChaussures: Object.keys(imp.valeursChaussures).reduce(function (acc, k) { var v = imp.valeursChaussures[k]; acc[k] = v === 'creer' && nouvellesPaires[k] ? nouvellesPaires[k].id : v; return acc; }, {}),
      valeursCapteur: imp.valeursCapteur, options: imp.options, nomSource: imp.nomSource, majLe: maintenant() };
    (paires.length ? DB.putMany('chaussures', paires) : Promise.resolve())
      .then(function () { return aSupprimer.length ? DB.removeMany('seances', aSupprimer) : null; })
      .then(function () { return aEcrire.length ? DB.putMany('seances', aEcrire) : null; })
      .then(function () { return DB.setMeta('profilsImport', profils); })
      .then(function () {
        var texteRapport = rapportTexte(a, rapport);
        imp = null;
        rafraichir();
        var z = $('#imp-zone');
        if (z) {
          z.innerHTML = '<div class="carte" style="margin-top:1rem" role="status"><h3>Rapport d\'import</h3><pre style="white-space:pre-wrap;font:inherit">' + esc(texteRapport) + '</pre>' +
            '<button type="button" class="btn" id="imp-rapport">Télécharger le rapport</button></div>';
          $('#imp-rapport').addEventListener('click', function () { telecharger('rapport-import-' + Core.todayParis() + '.txt', texteRapport, 'text/plain;charset=utf-8'); });
        }
        toast('Import appliqué.');
      }).catch(erreurStockage);
  }
  function rapportTexte(a, r) {
    var l = [];
    l.push('Import du ' + Core.formatDateFR(Core.todayParis()) + ' — ' + (imp ? imp.nomFichier : ''));
    l.push('Séances créées : ' + r.creees + ' ; modifiées : ' + r.modifiees + ' ; supprimées : ' + r.supprimees + ' ; identiques non modifiées : ' + a.identiques + '.');
    if (r.doublonsIgnores || r.doublonsRemplaces) l.push('Doublons ignorés : ' + r.doublonsIgnores + ' ; doublons remplacés : ' + r.doublonsRemplaces + '.');
    if (r.paires.length) l.push('Paires de chaussures créées : ' + r.paires.join(', ') + '.');
    l.push('Lignes vides ignorées : ' + a.ignores.vides + ' ; avant la date de début : ' + a.ignores.avant + '.');
    Object.keys(a.ignores.types).forEach(function (k) { l.push('Lignes ignorées (type « ' + k + ' ») : ' + a.ignores.types[k] + '.'); });
    l.push('Lignes rejetées : ' + a.rejets.length + (a.rejets.length ? '' : '.'));
    a.rejets.forEach(function (x) { l.push('  - ligne ' + x.ligne + ' : ' + x.motif); });
    l.push('Avertissements : ' + a.avert.length + (a.avert.length ? '' : '.'));
    a.avert.forEach(function (x) { l.push('  - ligne ' + x.ligne + ' : ' + x.motif); });
    l.push('Valeurs prévues extraites des consignes : ' + a.extraites.length + '.');
    return l.join('\n');
  }

  // Événements de l'assistant (délégués sur la zone d'import)
  function brancherImport() {
    var z = $('#imp-zone');
    if (!z || z.dataset.branche) return;
    z.dataset.branche = '1';
    z.addEventListener('change', function (e) {
      if (!imp) return;
      var t = e.target, d = t.dataset;

    var sx = function (iso) { return m.l + (Core.isoToUTC(iso) - t0) / Math.max(1, t1 - t0) * pw; };
    var sy = function (v) { return m.t + ph - (v - y0) / (y1 - y0) * ph; };
    var svg = el('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.titre });
    for (var v = y0; v <= y1 + 1e-9; v += pas) { el('line', { x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), class: 'grille' }, svg); txt(svg, m.l - 6, sy(v) + 4, fmt(v, 0), { class: 'axe', 'text-anchor': 'end' }); }
    o.reperes.forEach(function (r) { txt(svg, sx(r.iso), H - 8, r.lib, { class: 'axe', 'text-anchor': 'middle' }); });
    o.points.forEach(function (p) {
      el('circle', { cx: sx(p.date), cy: sy(p.y), r: 4, fill: 'var(--serie-realise)', class: 'point' }, svg);
      el('circle', { cx: sx(p.date), cy: sy(p.y), r: 12, class: 'cible', role: 'img', tabindex: 0, 'data-tip': JSON.stringify(p.tip), 'aria-label': p.tip.map(function (t) { return t.v; }).join(', ') }, svg);
    });
    conteneur.textContent = ''; conteneur.appendChild(svg);
  }

  // Allure par type : une ligne par type, un point par séance, un trait pour la moyenne pondérée
  function graphAllures(conteneur, lignes) {
    var W = Math.max(280, conteneur.clientWidth), lh = 40, m = { l: 118, r: 70, t: 22, b: 28 }, H = m.t + m.b + lignes.length * lh;
    var pw = W - m.l - m.r;
    var toutes = []; lignes.forEach(function (l) { l.seances.forEach(function (x) { toutes.push(x.allure); }); });
    var pas = 30, a0 = Math.floor(Math.min.apply(null, toutes) / pas) * pas, a1 = Math.ceil(Math.max.apply(null, toutes) / pas) * pas;
    if (a1 === a0) a1 = a0 + pas;
    while ((a1 - a0) / pas > Math.max(3, Math.floor(pw / 50))) pas *= 2;
    var sx = function (a) { return m.l + (a - a0) / (a1 - a0) * pw; };
    var svg = el('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Allure par type de séance' });
    for (var a = a0; a <= a1 + 1e-9; a += pas) { el('line', { x1: sx(a), x2: sx(a), y1: m.t, y2: H - m.b, class: 'grille' }, svg); txt(svg, sx(a), H - 8, Core.formatPace(a).replace(' /km', ''), { class: 'axe', 'text-anchor': 'middle' }); }
    lignes.forEach(function (l, i) {
      var cy = m.t + i * lh + lh / 2;
      txt(svg, m.l - 10, cy + 4, typeLabel(l.type), { class: 'etiquette', 'text-anchor': 'end' });
      l.seances.forEach(function (x) {
        el('circle', { cx: sx(x.allure), cy: cy, r: 4, fill: estCompetition(x.s) ? 'var(--course)' : 'var(--serie-realise)', class: 'point' }, svg);
        el('circle', { cx: sx(x.allure), cy: cy, r: 12, class: 'cible', role: 'img', tabindex: 0, 'data-tip': JSON.stringify([{ v: dateLongue(x.s.date) + ' — ' + typeLabel(x.s.type) }, { v: Core.formatPace(x.allure), l: fmt(x.s.distanceKm, 2) + ' km' }]), 'aria-label': Core.formatDateFR(x.s.date) + ' ' + Core.formatPace(x.allure) }, svg);
      });
      el('line', { x1: sx(l.allureMoy), x2: sx(l.allureMoy), y1: cy - 12, y2: cy + 12, class: 'moyenne' }, svg);
      txt(svg, W - m.r + 8, cy + 4, Core.formatPace(l.allureMoy).replace(' /km', ''), { class: 'valeur' });
    });
    txt(svg, W - m.r + 8, 12, 'moyenne', { class: 'axe' });
    conteneur.textContent = ''; conteneur.appendChild(svg);
  }

      tableDonnees(['Type', 'Séances', 'Allure moyenne'], apt.map(function (x) { return [typeLabel(x.type), String(x.seances.length), Core.formatPace(x.allureMoy)]; })) : '<p class="aide">Aucune séance avec durée et distance sur la période.</p>') + '</section></div>';

  /* =====================================================================

  var cal = { vue: 'semaine', ancre: null, deplacer: null, jourOuvert: null };

      '<button type="button" class="puce-corps" data-action="modifier" data-id="' + esc(s.id) + '" aria-label="' + esc((prevue ? 'Prévue : ' : 'Réalisée : ') + typeLabel(s.type) + ' ' + resumeSeance(s)) + '">' +
      '<span class="puce-type">' + esc(typeLabel(s.type)) + '</span>' + (s.intitule && !compacte ? '<span class="puce-int">' + esc(s.intitule) + '</span>' : '') +

    if (prevue && !compacte && !realisationsParPrevue()[s.id]) {

  // Lignes d'une journée : chaque séance prévue à côté de sa réalisation du même jour
  function lignesJour(iso) {
    var ss = seancesDuJour(iso), prevues = ss.filter(function (s) { return s.statut === 'prevue'; }), reals = ss.filter(function (s) { return s.statut === 'realisee'; });
    var utilisees = {}, lignes = [];
    var tous = realisationsParPrevue();
    prevues.forEach(function (p) {
      var r = reals.filter(function (x) { return x.prevueId === p.id && !utilisees[x.id]; });
      if (r.length) r.forEach(function (x, i) { utilisees[x.id] = 1; lignes.push([i === 0 ? p : null, x]); });
      else {
        var ailleurs = (tous[p.id] || []).filter(function (x) { return x.date !== iso; });
        lignes.push([p, null, ailleurs]);

    reals.forEach(function (x) { if (!utilisees[x.id]) lignes.push([null, x]); });
    return lignes;
  }
  function totauxSemaine(lun) {

        (st.mode === 'distance' ? '<dt>Temps cible par répétition</dt><dd><strong>' + Core.formatDuration(r.tempsRep) + '</strong></dd>' : (st.sansDistance ? '' : '<dt>Distance par répétition</dt><dd><strong>' + fmt(r.distanceRepKm * 1000, 0) + ' m</strong></dd>')) +

        formule('<p>vitesse = VMA × % / 100. Effort sur distance : temps = distance / vitesse. Effort sur durée : distance = vitesse × durée.</p>' +
