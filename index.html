  function cfgStrava() { return Object.assign({ worker: '', clientId: '', sports: 'Run, TrailRun, VirtualRun', depuis: '2026-01-01' }, DB.data.meta.stravaConfig || {}); }

  function appelRelais(chemin, init) {

        if (!r.ok) { var e = new Error(d.erreur ? d.erreur + (d.detail ? ' (' + d.detail + ')' : '') : 'erreur ' + r.status); e.statut = r.status; throw e; }
        return { d: d, r: r };

    }, function () { throw new Error('fonction relais injoignable (adresse, réseau ou origine non autorisée)'); });
  }

  function brancherStrava() {

  // Retour de Strava : ?code=…&state=…&scope=… (ou ?error=…)
  function retourStrava() {
    var p = new URLSearchParams(location.search);
    if (!p.has('code') && !p.has('error')) return Promise.resolve();
    var nettoyer = function () { history.replaceState(null, '', location.pathname + '#/donnees'); };
    if (p.get('error')) { nettoyer(); toast('Connexion Strava annulée ou refusée.'); return Promise.resolve(); }
    var attendu = memoEtat();
    if (!attendu || attendu !== p.get('state')) { nettoyer(); toast('Connexion Strava refusée : contrôle de sécurité (state) invalide. Recommence depuis « Connecter Strava ».'); return Promise.resolve(); }
    if (!/activity:read_all|activity:read/.test(p.get('scope') || '')) { nettoyer(); toast('Connexion Strava incomplète : l\'accès aux activités n\'a pas été accordé.'); return Promise.resolve(); }
    return appelRelais('/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: p.get('code') }) })
      .then(function (x) {
        return DB.setMeta('strava', { access_token: x.d.access_token, refresh_token: x.d.refresh_token, expires_at: x.d.expires_at, athlete: x.d.athlete, scope: p.get('scope'), connecteLe: maintenant(), dernierAfter: null, derniereSynchro: null });
      })
      .then(function () { nettoyer(); toast('Strava connecté.'); })
      .catch(function (e) { nettoyer(); toast('Échec de la connexion Strava : ' + e.message); });
  }
  // Jeton d'accès valide (renouvelé par la fonction relais s'il expire dans moins de 2 minutes)

    var st = DB.data.meta.strava;
    if (!st) return Promise.reject(new Error('Strava non connecté'));
    if (st.expires_at * 1000 - Date.now() > 120000) return Promise.resolve(st.access_token);
    return appelRelais('/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: st.refresh_token }) })
      .then(function (x) {
        var nv = Object.assign({}, st, { access_token: x.d.access_token, refresh_token: x.d.refresh_token || st.refresh_token, expires_at: x.d.expires_at });
        return DB.setMeta('strava', nv).then(function () { return nv.access_token; });
      });
  }
  function synchroniserStrava(toutReprendre) {
    var c = cfgStrava(), st = DB.data.meta.strava;
    var debutEpoch = Math.floor(Core.isoToUTC(c.depuis) / 1000) - 86400;
    var after = !toutReprendre && st.dernierAfter ? st.dernierAfter - 86400 : debutEpoch;   // marge d'un jour ; les doublons sont reconnus
    var z = $('#act-zone');
    if (z) { z.innerHTML = '<p role="status">Lecture des activités Strava…</p>'; z.scrollIntoView({ block: 'start' }); }
    var toutes = [], page = 1, MAX_PAGES = 30, usage = '';
    function suivante(jeton) {
      return appelRelais('/activities?after=' + after + '&page=' + page + '&per_page=100', { headers: { Authorization: 'Bearer ' + jeton } }).then(function (x) {
        usage = x.r.headers.get('X-ReadRateLimit-Usage') || x.r.headers.get('X-RateLimit-Usage') || usage;
        var lot = Array.isArray(x.d) ? x.d : [];
        toutes = toutes.concat(lot);
        if (lot.length === 100 && page < MAX_PAGES) { page++; return suivante(jeton); }
      });
    }
    return jetonStrava().then(suivante).then(function () {
      var vus = {}, lignes = [];
      toutes.forEach(function (a) { var l = Core.stravaVersLigne(a); if (l && l.date && l.date >= c.depuis && !vus[l.cle]) { vus[l.cle] = 1; lignes.push(l); } });
      var sports = sportsStrava(), maxDebut = toutes.reduce(function (m, a) { var t = Date.parse(a.start_date); return isFinite(t) && t > m ? t : m; }, 0);
      lignes.forEach(function (x) { x.garder = sports.indexOf(x.sport) >= 0; x.type = ''; x.choix = 'ignorer'; });
      act = { lignes: lignes, erreurs: [], champDuree: 'chrono', typeDefaut: '', source: 'import-strava',
        info: toutes.length + ' activité(s) lue(s) sur Strava depuis le ' + Core.formatDateFR(Core.todayParis(new Date(after * 1000))) + ' (' + page + ' requête(s)' + (usage ? ' ; compteur de lecture Strava 15 min,jour : ' + usage : '') + ').' + (page >= MAX_PAGES ? ' Limite de ' + MAX_PAGES + ' pages atteinte : relance la synchronisation pour la suite.' : ''),
        apresApplication: function () { return DB.setMeta('strava', Object.assign({}, DB.data.meta.strava, { dernierAfter: maxDebut ? Math.floor(maxDebut / 1000) : DB.data.meta.strava.dernierAfter, derniereSynchro: maintenant() })); } };
      rendreActivites();
    }).catch(function (e) {
      if (z) z.innerHTML = '<div class="erreurs" role="alert">Synchronisation impossible : ' + esc(e.message) + (e.statut === 401 ? ' — reconnecte Strava.' : '') + '</div>';
    });
  }

  /* =====================================================================
     AUTOTESTS
     ===================================================================== */
  ROUTES.tests = function (el) {
    var r = Core.runTests();
    var ko = r.filter(function (x) { return !x.ok; }).length;
    // Contrôle de cohérence : totaux du résumé du journal = somme directe des séances stockées
    var reals = DB.data.seances.filter(function (s) { return s.statut === 'realisee'; });
    var somme = reals.reduce(function (a, s) { return a + (Core.isNum(s.distanceKm) ? s.distanceKm : 0); }, 0);
    var t = Core.totals(reals);
    var coherent = Math.abs(t.km - somme) < 0.001;
    el.innerHTML = '<div class="vue-tete"><h2>Autotests des calculs</h2><a class="btn discret" href="#/donnees">Retour</a></div>' +
      '<p role="status"><strong>' + (r.length - ko) + ' / ' + r.length + ' tests réussis.</strong></p>' +
      '<ol class="tests">' + r.map(function (x) { return '<li class="' + (x.ok ? 'ok' : 'ko') + '">' + esc(x.nom) + (x.err ? ' — ' + esc(x.err) : '') + '</li>'; }).join('') + '</ol>' +
      '<h3>Cohérence sur tes données</h3><p>' + (coherent ? 'OK' : 'ÉCHEC') + ' : total km des séances réalisées = ' + fmt(t.km, 3) + ' (somme directe : ' + fmt(somme, 3) + ').</p>' +
      '<ul>' + (function () {
        // Cartes du tableau de bord comparées à une somme directe des séances du journal (km, D+, durée, nombre)
        var P = Core.periodes(Core.todayParis());
        return [['semaine', 'Cette semaine'], ['mois', 'Ce mois'], ['annee', 'Cette année']].map(function (k) {
          var per = P[k[0]], b = Core.bilan(DB.data.seances, per.du, per.au).realise, km = 0, dp = 0, du = 0, n = 0;
          DB.data.seances.forEach(function (x) {
            if (x.statut !== 'realisee' || x.date < per.du || x.date > per.au) return;
            n++; km += x.distanceKm || 0; dp += x.dplus || 0; du += x.dureeSec || 0;
          });
          var ok = Math.abs(b.km - km) < 0.001 && b.dplus === dp && b.dureeSec === du && b.n === n;
          return '<li class="' + (ok ? 'ok' : 'ko') + '">Tableau de bord, carte « ' + k[1] + ' » = somme du journal : ' + fmt(b.km, 2) + ' km, ' + fmt(b.dplus, 0) + ' m D+, ' + Core.formatDuration(b.dureeSec) + ', ' + b.n + ' séance(s)</li>';
        }).join('');
      })() + '</ul>';
  };

  /* =====================================================================
     ÉVÉNEMENTS GLOBAUX (délégation)
     ===================================================================== */
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-fermer]')) { fermerDialogue(); return; }
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var a = b.getAttribute('data-action'), id = b.getAttribute('data-id');
    switch (a) {
      case 'nouvelle': {
        var st = b.getAttribute('data-statut') || 'realisee';
        ouvrirFormSeance(nouvelleSeanceVide(st), 'creer', st === 'prevue' ? 'Nouvelle séance prévue' : 'Nouvelle séance réalisée');
        break;
      }
      case 'modifier': { var s = seanceParId(id); if (s) ouvrirFormSeance(s, 'modifier', 'Modifier la séance'); break; }
      case 'dupliquer': {
        var o = seanceParId(id); if (!o) break;
        var copie = Object.assign({}, o, { id: null, prevueId: null, source: 'manuelle', demo: undefined, creeLe: undefined, importCle: null, importRole: null, serieId: null });
        ouvrirFormSeance(copie, 'creer', 'Dupliquer la séance');
        break;
      }
      case 'realiser': {
        var p = seanceParId(id); if (!p) break;
        var r = Object.assign({}, p, { id: null, statut: 'realisee', prevueId: p.id, source: 'manuelle', demo: undefined, creeLe: undefined, importCle: null, importRole: null, extrait: null, conformite: null });
        ouvrirFormSeance(r, 'creer', 'Réaliser la séance prévue');
        break;
      }
      case 'supprimer': supprimerSeance(id); break;
      case 'trier': {
        var cle = b.getAttribute('data-cle');
        if (filtre.tri === cle) filtre.sens = -filtre.sens; else { filtre.tri = cle; filtre.sens = cle === 'date' ? -1 : 1; }
        var sel = $('#f-tri'); if (sel) sel.value = filtre.tri;
        listeJournal(); break;
      }
      case 'sens': filtre.sens = -filtre.sens; listeJournal(); break;
      case 'raz-filtres': filtre = { q: '', type: '', statut: '', course: '', du: '', au: '', tri: 'date', sens: -1, prevuesRealisees: false }; rafraichir(); break;
      case 'exporter': exporterJSON(); break;
      case 'exporter-csv': exporterCSV(); break;
      case 'imprimer': window.print(); break;
      case 'cal-nav': {
        var n = Number(b.getAttribute('data-n'));
        if (n === 0) cal.ancre = Core.todayParis();
        else cal.ancre = cal.vue === 'semaine' ? Core.addDays(cal.ancre, 7 * n) : Core.ajouterMois(cal.ancre, n);
        cal.jourOuvert = null; rafraichir(); break;
      }
      case 'cal-deplacer': { cal.deplacer = id; var sd = trouver('seances', id); if (sd) cal.ancre = sd.date; fermerDialogue(); if (routeCourante !== 'plan') location.hash = '#/plan'; else rafraichir(); break; }
      case 'cal-annuler-deplacement': cal.deplacer = null; rafraichir(); break;
      case 'cal-deposer': deplacerSeance(cal.deplacer, b.getAttribute('data-jour')); break;
      case 'cal-ouvrir-jour': cal.jourOuvert = cal.jourOuvert === b.getAttribute('data-jour') ? null : b.getAttribute('data-jour'); rafraichir(); break;
      case 'cal-ajouter': {
        var nv = nouvelleSeanceVide('prevue'); nv.date = b.getAttribute('data-jour');
        ouvrirFormSeance(nv, 'creer', 'Nouvelle séance prévue'); break;
      }
      case 'cal-recurrence': ouvrirRecurrence(); break;
      case 'cal-semaine-type': ouvrirSemaineType(); break;
      case 'suppr-serie': supprimerSerie(id); break;
      case 'z-ajouter': $('#z-corps').insertAdjacentHTML('beforeend', ligneZone({ nom: '', min: '', max: '' }, $$('#z-corps tr').length)); calculer(); break;
      case 'z-suppr': b.closest('tr').remove(); calculer(); break;
      case 'z-defaut': DB.setMeta('zones', []).then(function () { toast('Zones par défaut rétablies.'); rafraichir(); }).catch(erreurStockage); break;
      case 'z-enregistrer': {
        var zs = lireZones(), errZ = zs.filter(function (z) { return !z.nom || !Core.isNum(z.min) || !Core.isNum(z.max) || z.min <= 0 || z.max < z.min || z.max > 200; });
        if (errZ.length) { toast('Chaque zone doit avoir un nom et des % valides (min ≤ max).'); break; }
        DB.setMeta('zones', zs).then(function () { toast('Zones enregistrées.'); rafraichir(); }).catch(erreurStockage); break;
      }
      case 't-ajouter': {
        var o = { id: uid(), date: $('#t-date').value, valeur: calc.vmaTest ? Math.round(calc.vmaTest * 100) / 100 : null, methode: $('#t-meth').value.trim() || ((($('input[name="c-test"]:checked') || {}).value === '6min') ? 'Test de 6 min (demi-Cooper)' : 'Test progressif à paliers') };
        var ev = Core.validateVMA(o);
        if (ev.length) { toast('Impossible d\'ajouter : ' + ev.join(', ')); break; }
        DB.put('vma', o).then(function () {
          // Pas de rechargement de la page : les saisies des autres calculateurs sont conservées
          var cur = Core.currentVMA(DB.data.vma);
          if (cur && cur.id === o.id) { $('#c-vma').value = String(o.valeur).replace('.', ','); calculer(); }
          toast('VMA ' + fmt(o.valeur, 2) + ' km/h ajoutée au journal des VMA (' + Core.formatDateFR(o.date) + ')' + (cur && cur.id === o.id ? ', utilisée pour les calculs.' : '.'));
        }).catch(erreurStockage);
        break;
      }
      case 'strava-connecter': connecterStrava(); break;
      case 'strava-synchro': synchroniserStrava(false); break;
      case 'strava-tout': synchroniserStrava(true); break;
      case 'strava-deconnecter': {
        if (!confirm('Déconnecter Strava sur cet appareil ? Les séances déjà importées sont conservées.')) break;
        DB.setMeta('strava', null).then(function () { toast('Strava déconnecté sur cet appareil. Pour révoquer l\'accès, retire l\'application dans les paramètres de ton compte Strava (applications autorisées).', { duree: 9000 }); rafraichir(); }).catch(erreurStockage);
        break;
      }
      case 'tdb-semaines': tdb.semaines = Number(b.getAttribute('data-n')); rafraichir(); break;
      case 'charger-demo': {
        var d = demoDonnees();
        DB.putMany('chaussures', d.chaussures).then(function () { return DB.putMany('courses', d.courses); })
          .then(function () { return DB.putMany('seances', d.seances); })
          .then(function () { toast('Données de démo chargées (étiquetées DÉMO).'); rafraichir(); }).catch(erreurStockage);
        break;
      }
      case 'suppr-demo': {
        DB.COLLECTIONS.reduce(function (acc, s) {
          return acc.then(function () { return DB.removeMany(s, DB.data[s].filter(function (x) { return x.demo; }).map(function (x) { return x.id; })); });
        }, Promise.resolve()).then(function () { toast('Données de démo supprimées.'); rafraichir(); }).catch(erreurStockage);
        break;
      }
      case 'tout-effacer': {
        if (!confirm('Effacer définitivement toutes les données de cet appareil ?')) break;
        if (!confirm('Dernière confirmation : cette action est irréversible. Continuer ?')) break;
        DB.replaceAll({ seances: [], courses: [], chaussures: [], vma: [], meta: {} }).then(function () { toast('Toutes les données ont été effacées.'); rafraichir(); }).catch(erreurStockage);
        break;
      }
      case 'suppr-vma': supprimerAvecAnnulation('vma', id, 'Mesure de VMA'); break;
      case 'nouvelle-chaussure': ouvrirFormChaussure(null); break;
      case 'modif-chaussure': ouvrirFormChaussure(trouver('chaussures', id)); break;
      case 'suppr-chaussure': supprimerAvecAnnulation('chaussures', id, 'Paire'); break;
      case 'nouvelle-course': ouvrirFormCourse(null); break;
      case 'modif-course': ouvrirFormCourse(trouver('courses', id)); break;
      case 'suppr-course': supprimerAvecAnnulation('courses', id, 'Course'); break;
    }
  });
  // Clic sur le fond du dialogue = fermeture
  $('#dlg').addEventListener('click', function (e) { if (e.target === e.currentTarget) fermerDialogue(); });
  $('#dlg').addEventListener('cancel', function (e) { e.preventDefault(); fermerDialogue(); });

  window.addEventListener('hashchange', function () { router(); var v = $('#vue'); if (v) v.focus({ preventScroll: true }); window.scrollTo(0, 0); });
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('[data-evitement]')) return;
    e.preventDefault(); $('#vue').focus();
  });
  DB.init().then(function () {
    // Demande au navigateur de ne pas purger le stockage (sans effet si refusé)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    // Mode installable (PWA) : uniquement quand l'outil est servi en http(s), pas en fichier local
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
    return retourStrava().then(router);
  });
})();
</script>
