<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101C48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renfo Cross">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Renfo Cross</title>
<style>
/* ===== Couleurs : bleu marine, bleu azur, blanc (ACNA Anduze / My Running Lab) =====
   Contrastes vérifiés (WCAG AA) : texte ≥ 4,5:1, éléments graphiques ≥ 3:1. */
:root{
  --marine:#101C48; --azur:#3884C8;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F5F7FB;
  --texte:#101C48; --texte2:#46526F; --ligne:#C9D3E3;
  --accent:#2766A3; --btn:#2766A3; --btn-texte:#FFFFFF;
  --ok:#1C6E40; --ok-fond:#E3F2E8; --alerte:#8A4B00; --alerte-fond:#FFF1DC; --erreur:#A3221B;
  --entete:#101C48; --entete-texte:#FFFFFF;
  --bord-champ:#7A87A6; /* bord des champs et boutons : ≥ 3:1 (WCAG 1.4.11) */
  --tab-h:58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#081029; --surface:#111B3F; --surface2:#17234D;
    --texte:#F2F5FB; --texte2:#B6C1DA; --ligne:#2C3A6B;
    --accent:#86BDF0; --btn:#86BDF0; --btn-texte:#081029;
    --ok:#6FD49A; --ok-fond:#163A2A; --alerte:#F3BC5C; --alerte-fond:#3A2A0E; --erreur:#FF8F86;
    --entete:#0B1538; --bord-champ:#6B7DB5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texte);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button,input,textarea,select{font:inherit;color:inherit}
/* Pas de zoom au double tap sur les boutons (taps rapides sur ±2,5). */
button,a,input,summary,label{touch-action:manipulation}
a{color:var(--accent)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== En-tête ===== */
header.haut{background:var(--entete);color:var(--entete-texte);
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  position:sticky;top:0;z-index:20}
header.haut h1{margin:0;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:.2px}
header.haut p{margin:2px 0 0;font-size:14px;color:#D4DDF0}
header.haut .retour{color:#fff;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin:-6px 0 -6px -4px;padding:0 4px;font-size:16px}

main{max-width:720px;margin:0 auto;padding:12px calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
.carte{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.carte h2{margin:0 0 6px;font-size:17px}
.sec{color:var(--texte2);font-size:15px}
.petit{font-size:14px;color:var(--texte2)}
.etiq{display:inline-block;border:1px solid var(--ligne);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--texte2);margin:0 6px 6px 0}
.etiq.fort{background:var(--marine);border-color:var(--marine);color:#fff}
.bandeau{border-left:4px solid var(--alerte);background:var(--alerte-fond);color:var(--texte);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.bandeau.err{border-left-color:var(--erreur)}
.bandeau b{color:var(--alerte)}
.bandeau a{display:inline-flex;align-items:center;min-height:44px}
.bandeau.err b{color:var(--erreur)}

/* ===== Boutons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:10px;
  border:1px solid var(--btn);background:var(--btn);color:var(--btn-texte);font-weight:600;font-size:17px;text-decoration:none;cursor:pointer}
.btn.large{width:100%}
.btn.second{background:transparent;color:var(--accent);border-color:var(--accent)}
.liste-seances{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ligne-seance{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 12px;border:1px solid var(--ligne);
  border-radius:10px;background:var(--surface2);color:var(--texte);text-decoration:none}
.ligne-seance b{display:block;font-size:16px}
.ligne-seance small{color:var(--texte2);font-size:14px}
.statut{font-size:14px;white-space:nowrap;border-radius:999px;padding:2px 10px;border:1px solid var(--ligne);color:var(--texte2)}
.statut.faite{background:var(--ok-fond);border-color:var(--ok);color:var(--ok);font-weight:600}
.statut.encours{border-color:var(--accent);color:var(--accent)}
.statut.manquee{border-color:var(--erreur);color:var(--erreur)}

/* ===== Séance ===== */
details.section{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;margin-bottom:12px}
details.section>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
  min-height:48px;padding:6px 14px;font-weight:700;font-size:16px;text-transform:none}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::after{content:"▾";color:var(--texte2);font-size:14px}
details.section:not([open])>summary::after{content:"▸"}
details.section>summary .compte{margin-left:auto;font-weight:500;color:var(--texte2);font-size:14px}
.ex{border-top:1px solid var(--ligne);padding:12px 14px}
.ex-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-nom{font-size:19px;font-weight:700;line-height:1.25;margin:0}
.ex-nom{flex:1;min-width:0}
.ex-charge{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;max-width:55%;overflow-wrap:anywhere}
.ex-charge.long{font-size:16px;font-weight:600}
.ex-presc{color:var(--texte2);font-size:15px;margin-top:2px}
details.rem{margin-top:4px}
details.rem>summary{cursor:pointer;color:var(--accent);font-size:15px;min-height:44px;display:flex;align-items:center;width:max-content}
details.rem p{margin:0 0 6px;font-size:15px;color:var(--texte2)}
/* Ligne de série en grille fluide : n° | −2,5 | charge | +2,5 | reps | faite (tient dans 375 px) */
.serie{display:grid;grid-template-columns:24px 44px minmax(52px,1fr) 44px minmax(48px,64px) 48px;gap:6px;align-items:center;margin-top:8px}
.serie.sans-kg{grid-template-columns:24px minmax(48px,90px) 1fr 48px}
.serie.tete{margin-top:10px;font-size:13px;color:var(--texte2)}
.serie.tete .c-kg{grid-column:2 / span 3;text-align:center}
.serie.tete .c-fait{text-align:center}
.serie .num{color:var(--texte2);font-size:14px;font-variant-numeric:tabular-nums}
.pas{width:44px;height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface2);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.serie input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface);text-align:center;
  font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.fait{width:48px;height:48px;border-radius:12px;border:2px solid var(--bord-champ);background:var(--surface);
  font-size:22px;line-height:1;color:transparent;cursor:pointer;padding:0;justify-self:end}
.fait[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){.fait[aria-pressed="true"]{color:#081029}}
.serie input::placeholder,.note::placeholder{color:var(--texte2);opacity:1;font-weight:500}
.serie.ok input{border-color:var(--ok)}
.rpe{margin-top:10px}
.rpe-l{font-size:14px;color:var(--texte2);margin-bottom:4px}
.rpe-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe-btns button{min-height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface2);font-size:17px;font-weight:700;cursor:pointer}
.rpe-btns button[aria-pressed="true"]{background:var(--btn);color:var(--btn-texte);border-color:var(--btn)}
.note{width:100%;margin-top:8px;min-height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface);padding:8px 10px;font-size:16px}
.case{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-top:1px solid var(--ligne);cursor:pointer}
.case input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--ok);margin:0}
.case b{font-weight:600}
.case .sec{display:block;font-size:14px}
.pied-seance{margin:16px 0 8px}
.etat-ecran{font-size:13px;color:var(--texte2);text-align:center;margin-top:8px}

/* ===== Minuteur de récupération (au-dessus de la barre d'onglets) ===== */
#minuteur{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:30;
  background:var(--marine);color:#fff;padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
#minuteur[hidden]{display:none}
body.avec-minuteur{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 90px)}
#minuteur .m-txt{flex:1;min-width:0}
#minuteur .m-lib{font-size:13px;color:#D4DDF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minuteur .m-temps{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#minuteur button{min-width:48px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#minuteur .barre{position:absolute;left:0;top:0;height:3px;background:var(--azur)}
#minuteur.fini{background:#1C6E40}
#minuteur.fini .barre{display:none}

/* ===== Barre d'onglets ===== */
nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--ligne);
  display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);
  color:var(--texte2);text-decoration:none;font-size:12px;font-weight:600}
nav.onglets a svg{width:24px;height:24px}
nav.onglets a[aria-current="page"]{color:var(--accent)}
nav.onglets a[aria-current="page"]::before{content:"";position:absolute;width:32px;height:3px;border-radius:2px;background:var(--accent);transform:translateY(-27px)}

/* Résumé */
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.chiffre{background:var(--surface2);border:1px solid var(--ligne);border-radius:10px;padding:10px;text-align:center}
.chiffre b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.chiffre span{font-size:13px;color:var(--texte2)}
@media (min-width:700px){ main{padding-top:20px} }
</style>
</head>
<body>
<header class="haut" id="entete"><h1>Renfo Cross</h1><p id="sous-titre">Chargement…</p></header>
<main id="vue" tabindex="-1"></main>

<div id="minuteur" role="timer" aria-live="off" hidden>
  <div class="barre" id="m-barre"></div>
  <div class="m-txt"><div class="m-lib" id="m-lib">Récupération</div><div class="m-temps" id="m-temps">0:00</div></div>
  <button type="button" data-m="-15" aria-label="Retirer 15 secondes">−15</button>
  <button type="button" data-m="+15" aria-label="Ajouter 15 secondes">+15</button>
  <button type="button" data-m="stop" aria-label="Arrêter le minuteur">✕</button>
</div>
<div class="vh" id="annonce" aria-live="polite"></div>

<nav class="onglets" aria-label="Navigation principale">
  <a href="#/" data-onglet="aujourdhui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Aujourd'hui</a>
  <a href="#/programme" data-onglet="programme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Programme</a>
  <a href="#/progression" data-onglet="progression"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Progression</a>
  <a href="#/donnees" data-onglet="donnees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Données</a>
</nav>

<script>
'use strict';
/* =====================================================================
   Renfo Cross : suivi du programme de renforcement (PWA, sans dépendance).
   Le plan (exercices, charges, règles) vient de data/plan.json, généré par
   tools/build-plan.js à partir des CSV du Google Sheet. L'app n'invente rien :
   si une donnée manque dans le plan, elle l'affiche comme manquante.
   Les saisies restent dans ce navigateur (localStorage). Rien n'est envoyé.
   ===================================================================== */

var PLAN = null;          // contenu de plan.json
var D = null;             // saisies (voir donneesVides)
var CLE = 'renfo-cross-saisies-v1';
var ANCIENNE_CLE = 'renfo-cross-2026-v1'; // première version de l'app (format différent, non reprise)
var stockageOK = true;

/* ---------- Stockage local ---------- */
function donneesVides() {
  return {
    v: 1,
    seances: {},   // « S1-1 » : { debut, fin, faite, ex: { idExercice: { fait, series:[{kg,reps,ok,t}], rpe, note } } }
    semaines: {},  // « S1 » : { poids, fractionne }
    minuteur: null // { fin (ms), total (s), lib }
  };
}
function charger() {
  try {
    var t = localStorage.getItem(CLE);
    D = t ? JSON.parse(t) : donneesVides();
  } catch (e) { stockageOK = false; D = donneesVides(); }
  if (!D || D.v !== 1) D = donneesVides();
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(D)); stockageOK = true; }
  catch (e) { stockageOK = false; afficherBandeauStockage(); }
}
function donneesSontVides() { return Object.keys(D.seances).length === 0 && Object.keys(D.semaines).length === 0; }
function ancienneVersionPresente() { try { return !!localStorage.getItem(ANCIENNE_CLE); } catch (e) { return false; } }

/* ---------- Dates (heure locale de l'appareil) ---------- */
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function dateISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function jourSeul(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function ajouterJours(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function memeJour(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function fmtJour(d) { return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fmtCourt(d) { return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
// Date du jour. Paramètre de test : index.html?jour=2026-11-12 simule une autre date.
function aujourdhui() {
  var m = location.search.match(/[?&]jour=(\d{4}-\d{2}-\d{2})/);
  return m ? dateISO(m[1]) : jourSeul(new Date());
}
function semaineDe(d) {
  for (var i = 0; i < PLAN.semaines.length; i++) {
    var s = PLAN.semaines[i];
    if (d >= dateISO(s.debut) && d <= dateISO(s.fin)) return s;
  }
  return null;
}
// Décalage depuis le lundi : lundi = 0 … dimanche = 6.
function decalage(jourIndex) { return (jourIndex + 6) % 7; }
function dateSeance(sem, n) { var t = PLAN.seancesType[n - 1]; return ajouterJours(dateISO(sem.debut), decalage(t.jourIndex)); }
function semaineParId(id) { for (var i = 0; i < PLAN.semaines.length; i++) if (PLAN.semaines[i].id === id) return PLAN.semaines[i]; return null; }
function seanceDuPlan(sem, n) { return sem && sem.seances ? sem.seances.filter(function (s) { return s.n === n; })[0] || null : null; }

/* ---------- Outils ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nombre(v) { if (v === '' || v == null) return null; var x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? null : x; }
function fmtNb(x) { return x == null ? '' : String(Math.round(x * 100) / 100).replace('.', ','); }
function cleSeance(semId, n) { return semId + '-' + n; }
function saisieSeance(semId, n) { return D.seances[cleSeance(semId, n)] || null; }
function annoncer(t) { var a = document.getElementById('annonce'); a.textContent = ''; setTimeout(function () { a.textContent = t; }, 50); }

// Statut d'une séance : faite / en cours / manquée / à faire.
function statutSeance(sem, n) {
  var s = saisieSeance(sem.id, n);
  if (s && s.faite) return { cle: 'faite', txt: 'Faite' };
  if (dateSeance(sem, n) < aujourdhui()) return s ? { cle: 'manquee', txt: 'Non terminée' } : { cle: 'manquee', txt: 'Manquée' };
  if (s) return { cle: 'encours', txt: 'En cours' };
  return { cle: '', txt: 'À faire' };
}

/* ---------- Navigation (hash) ---------- */
function route() {
  var h = location.hash.replace(/^#\/?/, '').split('/');
  libererEcran();
  document.querySelectorAll('nav.onglets a').forEach(function (a) { a.removeAttribute('aria-current'); });
  var onglet = 'aujourdhui';
  if (h[0] === 'seance' && h[1] && h[2]) { vueSeance(h[1], +h[2]); onglet = ''; }
  else if (h[0] === 'resume' && h[1] && h[2]) { vueResume(h[1], +h[2]); onglet = ''; }
  else if (h[0] === 'programme') { onglet = 'programme'; vueAVenir('Programme', 'Le calendrier des 16 semaines arrive à l\'étape 2.'); }
  else if (h[0] === 'progression') { onglet = 'progression'; vueAVenir('Progression', 'Les courbes de charge et d\'e1RM arrivent à l\'étape 2.'); }
  else if (h[0] === 'donnees') { onglet = 'donnees'; vueAVenir('Données', 'Export CSV / JSON, import et réinitialisation arrivent à l\'étape 3. Tes saisies sont déjà enregistrées sur cet appareil, à chaque modification.'); }
  else vueAujourdhui();
  var lien = document.querySelector('nav.onglets a[data-onglet="' + onglet + '"]');
  if (lien) lien.setAttribute('aria-current', 'page');
  window.scrollTo(0, 0);
}
function entete(titre, sousTitre, retour) {
  document.getElementById('entete').innerHTML =
    (retour ? '<a class="retour" href="' + retour + '">‹ Retour</a>' : '') +
    '<h1>' + esc(titre) + '</h1>' + (sousTitre ? '<p>' + esc(sousTitre) + '</p>' : '');
}

/* ---------- Bandeaux d'information ---------- */
function bandeaux() {
  var h = '';
  if (!stockageOK) h += '<div class="bandeau err" role="alert"><b>Sauvegarde impossible.</b> Le stockage de ce navigateur refuse l\'écriture (mode privé ou espace plein). Tes saisies seront perdues à la fermeture.</div>';
  if (donneesSontVides()) {
    h += '<div class="bandeau" role="status"><b>Aucune saisie sur cet appareil.</b> Si tu avais déjà saisi des séances ici, iOS a pu vider le stockage de l\'app : restaure ta dernière sauvegarde JSON (onglet Données, disponible à l\'étape 3).' +
      (ancienneVersionPresente() ? ' Des données de la première version de Renfo Cross existent dans ce navigateur ; elles ne sont pas reprises automatiquement.' : '') + '</div>';
  }
  return h;
}
function afficherBandeauStockage() {
  var v = document.getElementById('vue');
  if (v && !v.querySelector('.bandeau.err')) v.insertAdjacentHTML('afterbegin', '<div class="bandeau err" role="alert"><b>Sauvegarde impossible.</b> Le stockage de ce navigateur refuse l\'écriture. Tes dernières saisies ne sont pas enregistrées.</div>');
}

/* ---------- Écran AUJOURD'HUI ---------- */
function lienSeance(sem, n) {
  var t = PLAN.seancesType[n - 1], st = statutSeance(sem, n), d = dateSeance(sem, n);
  return '<a class="ligne-seance" href="#/seance/' + sem.id + '/' + n + '"><span><b>' + esc(t.nom) + '</b><small>' + esc(fmtCourt(d)) + '</small></span>' +

// Prochaine séance de renfo strictement après la date donnée (d'après les jours des séances du plan).

/* ---------- Écran SÉANCE ---------- */
var COURANT = null; // { sem, n, detail, cle }

function saisieEx(id, creer) {

  if (!s) { if (!creer) return null; s = D.seances[COURANT.cle] = { debut: Date.now(), fin: null, faite: false, ex: {} }; }
  if (!s.debut) s.debut = Date.now();

}
function exParId(id) {
  var r = null;
  COURANT.detail.sections.forEach(function (sec) { sec.exercices.forEach(function (e) { if (e.id === id) r = e; }); });

}
// Affiche la charge prévue telle qu'écrite dans le plan (texte exact du Sheet).
function libelleUnite(e) {
  if (e.p.unite === 's') return 's';

  return 'reps';
}
function aChargeSaisissable(e) { return e.charge.kg != null || e.charge.min != null || /kg/.test(e.chargePrevue); }

function htmlExercice(e) {
  var s = saisieEx(e.id, false);
  if (e.saisie === 'case') {
    var coche = s && s.fait;
    return '<label class="case"><input type="checkbox" data-a="case" data-ex="' + e.id + '"' + (coche ? ' checked' : '') + '>' +
      '<span><b>' + esc(e.nom) + '</b><span class="sec">' + esc([e.chargePrevue, e.prescription, e.remarques].filter(Boolean).join(' · ')) + '</span></span></label>';

    (e.remarques ? '<details class="rem"><summary>Remarques</summary><p>' + esc(e.remarques) + '</p></details>' : '');
  var kgOK = aChargeSaisissable(e), unite = libelleUnite(e), sk = kgOK ? '' : ' sans-kg';
  // En-tête des colonnes (une seule fois par exercice, pour garder les lignes étroites)
  h += '<div class="serie tete' + sk + '" aria-hidden="true"><span></span>' +
    (kgOK ? '<span class="c-kg">Charge (' + (e.charge.mult === 2 ? 'kg, ×2 haltères' : 'kg') + ')</span>' : '') +
    '<span>' + (unite === 'reps' ? 'Reps' : (unite === 's' ? 'Secondes' : 'Mètres')) + (e.p.repsTexte ? ' ' + esc(e.p.repsTexte) : '') + '</span>' +
    (kgOK ? '' : '<span></span>') + '<span class="c-fait">Faite</span></div>';
  for (var i = 0; i < e.p.series; i++) {
    var se = s && s.series[i];
    // Pré-remplissage : valeur saisie, sinon celle de la série précédente saisie, sinon la charge prévue (si valeur unique).

        '<button type="button" class="pas" data-a="plus" aria-label="Plus 2,5 kg, série ' + (i + 1) + '">+2,5</button>' : '') +
      '<input class="reps" type="text" inputmode="numeric" autocomplete="off" data-a="reps" aria-label="' + unite + ' réalisées série ' + (i + 1) + '"' +
      ' value="' + esc(reps == null ? '' : reps) + '" placeholder="' + unite + '">' + (kgOK ? '' : '<span></span>') +
      '<button type="button" class="fait" data-a="ok" aria-pressed="' + (se && se.ok ? 'true' : 'false') + '" aria-label="Série ' + (i + 1) + ' faite">✓</button></div>';
  }
  h += '<div class="rpe"><div class="rpe-l">RPE dernière série' + (e.p.rpeCible ? ' (cible ' + esc(e.p.rpeCible) + ')' : '') + '</div><div class="rpe-btns" role="group" aria-label="RPE dernière série, ' + esc(e.nom) + '">';

function chargeParDefaut(e, s, i) {

}
function compteSection(sec) {

function vueSeance(semId, n) {

function majCompteurs() {
  if (!COURANT) return;

// Enregistre la série i d'après les champs affichés (charge et reps lus dans la ligne).
function lireSerie(ligne, e, ok) {
  var x = saisieEx(e.id, true), i = +ligne.getAttribute('data-i');
  var kgIn = ligne.querySelector('[data-a="kg"]'), repsIn = ligne.querySelector('[data-a="reps"]');
  var prec = x.series[i] || {};
  while (x.series.length <= i) x.series.push(null);
  x.series[i] = {
    kg: kgIn ? nombre(kgIn.value) : null,
    reps: nombre(repsIn.value),
    ok: ok == null ? !!prec.ok : ok,
    t: Date.now()
  };
  return x.series[i];
}
// Quand la charge d'une série change, les séries suivantes jamais touchées suivent (affichage uniquement).
function propagerCharge(ligne, e) {
  var x = saisieEx(e.id, false), i = +ligne.getAttribute('data-i'), val = ligne.querySelector('[data-a="kg"]').value;
  var bloc = ligne.parentNode;
  bloc.querySelectorAll('.serie').forEach(function (l) {
    var j = +l.getAttribute('data-i');
    if (j > i && !(x && x.series[j])) l.querySelector('[data-a="kg"]').value = val;
  });
}
function surAction(ev) {
  var cible = ev.target.closest('[data-a]');
  if (!cible || !COURANT) { if (cible && cible.getAttribute('data-a') === 'rouvrir') rouvrir(); return; }
  var a = cible.getAttribute('data-a');
  if (a === 'terminer') { terminer(); return; }
  if (a === 'rouvrir') { rouvrir(); return; }
  var exEl = cible.closest('[data-ex]'); if (!exEl) return;
  var e = exParId(exEl.getAttribute('data-ex')); if (!e) return;
  var ligne = cible.closest('.serie');
  if (a === 'case') { saisieEx(e.id, true).fait = cible.checked; }
  else if (a === 'moins' || a === 'plus') {
    var inp = ligne.querySelector('[data-a="kg"]');
    var v = nombre(inp.value); if (v == null) v = e.charge.kg != null ? e.charge.kg : (e.charge.min != null ? e.charge.min : 0);
    v = Math.max(0, v + (a === 'plus' ? 2.5 : -2.5));
    inp.value = fmtNb(v);
    lireSerie(ligne, e); propagerCharge(ligne, e);
  }
  else if (a === 'ok') {
    var dejaOk = cible.getAttribute('aria-pressed') === 'true';
    var se = lireSerie(ligne, e, !dejaOk);
    cible.setAttribute('aria-pressed', se.ok ? 'true' : 'false');
    ligne.classList.toggle('ok', se.ok);
    debloquerSon();
    if (se.ok) {
      if (e.p.recupSec) demarrerMinuteur(e.p.recupSec, e.nom + ' · S' + (+ligne.getAttribute('data-i') + 1) + ' faite');
      annoncer('Série ' + (+ligne.getAttribute('data-i') + 1) + ' faite' + (e.p.recupSec ? ', récupération ' + e.p.recupTexte : ''));
    }
  }
  else if (a === 'rpe') {
    var x = saisieEx(e.id, true), r = +cible.getAttribute('data-v');
    x.rpe = x.rpe === r ? null : r; // second tap : efface
    cible.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-v') === x.rpe ? 'true' : 'false'); });
  }
  else return;
  sauver(); majCompteurs();
}
function surSaisie(ev) {
  var cible = ev.target, a = cible.getAttribute('data-a');
  if (!COURANT || !a) return;
  var exEl = cible.closest('[data-ex]'); if (!exEl) return;
  var e = exParId(exEl.getAttribute('data-ex')); if (!e) return;
  if (a === 'kg' || a === 'reps') { var l = cible.closest('.serie'); lireSerie(l, e); if (a === 'kg') propagerCharge(l, e); }
  else if (a === 'note') saisieEx(e.id, true).note = cible.value;
  else return;
  sauver();
}

/* ---------- Fin de séance et résumé ---------- */
function terminer() {
  var s = D.seances[COURANT.cle] || (D.seances[COURANT.cle] = { debut: null, fin: null, faite: false, ex: {} });
  s.faite = true; if (!s.fin) s.fin = Date.now();
  sauver(); arreterMinuteur();
  location.hash = '#/resume/' + COURANT.sem.id + '/' + COURANT.n;
}
function rouvrir() {
  var h = location.hash.split('/'), cle = cleSeance(h[2], +h[3]), s = D.seances[cle];
  if (s) { s.faite = false; s.fin = null; sauver(); }
  location.hash = '#/seance/' + h[2] + '/' + h[3];
}
// Calculs du résumé. Volume = Σ charge × répétitions des séries faites, charge × 2 quand le plan indique deux haltères
// (« 2 × 10 kg », « … par main »). Les séries en secondes ou en mètres ne comptent pas dans le volume.
function resumeSeance(semId, n) {
  var sem = semaineParId(semId), detail = seanceDuPlan(sem, n), s = saisieSeance(semId, n) || { ex: {} };
  var volume = 0, rpes = [], faites = 0, prevues = 0;
  detail.sections.forEach(function (sec) {
    sec.exercices.forEach(function (e) {
      if (e.saisie !== 'series') return;
      prevues += e.p.series;
      var x = s.ex[e.id]; if (!x) return;
      if (x.rpe != null) rpes.push(x.rpe);
      x.series.forEach(function (se) {
        if (!se || !se.ok) return;
        faites++;
        if (se.kg != null && se.reps != null && e.p.unite !== 's' && e.p.unite !== 'm') volume += se.kg * e.charge.mult * se.reps;
      });
    });
  });
  return {
    volume: volume, faites: faites, prevues: prevues,
    rpeMoyen: rpes.length ? rpes.reduce(function (a, b) { return a + b; }, 0) / rpes.length : null, nbRpe: rpes.length,
    dureeMin: s.debut && s.fin ? Math.round((s.fin - s.debut) / 60000) : null
  };
}
function vueResume(semId, n) {
  var sem = semaineParId(semId), t = PLAN.seancesType[n - 1];
  if (!sem || !seanceDuPlan(sem, n)) { route0(); return; }
  var r = resumeSeance(semId, n);
  entete('Résumé · ' + sem.id + ' · ' + t.nom, fmtJour(dateSeance(sem, n)), '#/');
  var duree = r.dureeMin == null ? '—' : (r.dureeMin >= 60 ? Math.floor(r.dureeMin / 60) + ' h ' + String(r.dureeMin % 60).padStart(2, '0') : r.dureeMin + ' min');
  document.getElementById('vue').innerHTML = bandeaux() +
    '<div class="carte"><h2>Séance enregistrée</h2><div class="chiffres">' +
    '<div class="chiffre"><b>' + fmtNb(Math.round(r.volume)) + '</b><span>kg de volume</span></div>' +
    '<div class="chiffre"><b>' + (r.rpeMoyen == null ? '—' : fmtNb(Math.round(r.rpeMoyen * 10) / 10)) + '</b><span>RPE moyen</span></div>' +
    '<div class="chiffre"><b>' + duree + '</b><span>durée</span></div></div>' +
    '<p class="petit">' + r.faites + ' séries faites sur ' + r.prevues + ' prévues. RPE moyen sur ' + r.nbRpe + ' exercice(s) noté(s). ' +
    'Volume : somme charge × répétitions des séries cochées (× 2 quand le plan indique deux haltères ; séries en secondes ou en mètres exclues). ' +
    'Durée : de la première saisie au bouton « Terminer ».</p>' +
    '<p class="petit">Les suggestions Monter / Maintenir / Réduire arrivent à l\'étape 2.</p>' +
    '<div class="liste-seances"><a class="btn large" href="#/">Retour à aujourd\'hui</a>' +
    '<button type="button" class="btn second large" data-a="rouvrir">Rouvrir la séance</button></div></div>';
}
function route0() { location.hash = '#/'; }

/* ---------- Écrans à venir (étapes 2 et 3) ---------- */
function vueAVenir(titre, txt) {
  COURANT = null;
  entete(titre, '');
  document.getElementById('vue').innerHTML = bandeaux() + '<div class="carte"><h2>' + esc(titre) + '</h2><p class="sec">' + esc(txt) + '</p></div>';

/* ---------- Minuteur de récupération ----------
   Calculé à partir d'un horodatage de fin (D.minuteur.fin) : aucune dérive, même si l'app passe
   en arrière-plan (iOS suspend alors le JavaScript ; au retour, le temps restant est recalculé).
   L'état est enregistré : si l'app est fermée puis rouverte, le minuteur reprend où il en est. */
var tic = null, finSignalee = false, audio = null;
function demarrerMinuteur(sec, lib) {
  D.minuteur = { fin: Date.now() + sec * 1000, total: sec, lib: lib };
  finSignalee = false; sauver(); lancerTic();
}
function arreterMinuteur() { D.minuteur = null; sauver(); clearInterval(tic); tic = null; document.getElementById('minuteur').hidden = true; document.body.classList.remove('avec-minuteur'); }
function lancerTic() { clearInterval(tic); majMinuteur(); tic = setInterval(majMinuteur, 250); }
function majMinuteur() {
  var m = D.minuteur, el = document.getElementById('minuteur');
  if (!m) { el.hidden = true; document.body.classList.remove('avec-minuteur'); clearInterval(tic); return; }
  var reste = Math.ceil((m.fin - Date.now()) / 1000);
  el.hidden = false; document.body.classList.add('avec-minuteur');
  if (reste <= 0) {
    el.classList.add('fini');
    document.getElementById('m-temps').textContent = 'Récup terminée';
    document.getElementById('m-lib').textContent = m.lib;
    if (!finSignalee) { finSignalee = true; signalerFin(); }
    // Le bandeau vert reste 20 s puis disparaît.
    if (Date.now() - m.fin > 20000) arreterMinuteur();
    return;
  }
  el.classList.remove('fini');
  document.getElementById('m-temps').textContent = Math.floor(reste / 60) + ':' + String(reste % 60).padStart(2, '0');
  document.getElementById('m-lib').textContent = 'Récup · ' + m.lib;
  document.getElementById('m-barre').style.width = Math.max(0, Math.min(100, 100 * reste / m.total)) + '%';
}
function surMinuteur(ev) {
  var b = ev.target.closest('[data-m]'); if (!b || !D.minuteur) return;
  var a = b.getAttribute('data-m');
  if (a === 'stop') { arreterMinuteur(); return; }
  var delta = a === '+15' ? 15000 : -15000;
  // Si la récup était finie, +15 repart de maintenant.
  D.minuteur.fin = Math.max(Date.now(), D.minuteur.fin) + delta;
  D.minuteur.total = Math.max(D.minuteur.total, Math.ceil((D.minuteur.fin - Date.now()) / 1000));
  finSignalee = false; sauver(); majMinuteur();
}
// Son : iOS n'autorise l'audio qu'après un geste de l'utilisateur ; on prépare le contexte au tap sur « faite ».
function debloquerSon() {
  try {
    if (!audio) { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); }
    if (audio && audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }
}
function signalerFin() {
  annoncer('Récupération terminée');
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* non pris en charge (iPhone) */ }
  try {
    if (!audio || audio.state !== 'running') return;
    [0, 0.3, 0.6].forEach(function (dt) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      var t0 = audio.currentTime + dt;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) { /* son indisponible : le bandeau vert suffit */ }
}

/* ---------- Écran allumé pendant la séance (Wake Lock API, repli silencieux) ---------- */
var verrou = null;
function etatEcran(t) { var el = document.getElementById('etat-ecran'); if (el) el.textContent = t; }
function garderEcranAllume() {
  if (!('wakeLock' in navigator)) { etatEcran('Écran allumé : non pris en charge par ce navigateur.'); return; }
  if (verrou || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function (v) {
    verrou = v; etatEcran('Écran maintenu allumé pendant la séance.');
    v.addEventListener('release', function () { verrou = null; });
  }).catch(function () { etatEcran('Écran allumé : refusé par le navigateur.'); });
}
function libererEcran() { if (verrou) { try { verrou.release(); } catch (e) {} verrou = null; } }

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    majMinuteur(); if (D && D.minuteur) lancerTic();
    if (COURANT && /^#\/seance\//.test(location.hash)) garderEcranAllume(); // le verrou est perdu en arrière-plan
  }
});

/* ---------- Démarrage ---------- */
function demarrer() {
  charger();
  // Demande au navigateur de ne pas effacer le stockage (sans garantie, surtout sur iOS).
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  var v = document.getElementById('vue');
  v.addEventListener('click', surAction);
  v.addEventListener('input', surSaisie);
  document.getElementById('minuteur').addEventListener('click', surMinuteur);
  fetch('data/plan.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (p) {
      PLAN = p;
      window.addEventListener('hashchange', route);
      route();
      if (D.minuteur) lancerTic();
    })
    .catch(function (err) {
      entete('Renfo Cross', '');
      v.innerHTML = '<div class="bandeau err" role="alert"><b>Plan introuvable.</b> Le fichier data/plan.json n\'a pas pu être chargé (' + esc(err.message) + '). Ouvre l\'app une fois avec du réseau pour la mettre en cache.</div>';
    });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
}
demarrer();
</script>
