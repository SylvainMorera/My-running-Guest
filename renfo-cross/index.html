<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101C48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renfo Cross">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Renfo Cross</title>
<style>
/* ===== Couleurs : bleu marine, bleu azur, blanc (ACNA Anduze / My Running Lab) =====
   Contrastes vérifiés (WCAG AA) : texte ≥ 4,5:1, éléments graphiques ≥ 3:1. */
:root{
  --marine:#101C48; --azur:#3884C8;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F5F7FB;
  --texte:#101C48; --texte2:#46526F; --ligne:#C9D3E3;
  --accent:#2766A3; --btn:#2766A3; --btn-texte:#FFFFFF;
  --ok:#1C6E40; --ok-fond:#E3F2E8; --alerte:#8A4B00; --alerte-fond:#FFF1DC; --erreur:#A3221B;
  --entete:#101C48; --entete-texte:#FFFFFF;
  --bord-champ:#7A87A6; /* bord des champs et boutons : ≥ 3:1 (WCAG 1.4.11) */
  --tab-h:58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#081029; --surface:#111B3F; --surface2:#17234D;
    --texte:#F2F5FB; --texte2:#B6C1DA; --ligne:#2C3A6B;
    --accent:#86BDF0; --btn:#86BDF0; --btn-texte:#081029;
    --ok:#6FD49A; --ok-fond:#163A2A; --alerte:#F3BC5C; --alerte-fond:#3A2A0E; --erreur:#FF8F86;
    --entete:#0B1538; --bord-champ:#6B7DB5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texte);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button,input,textarea,select{font:inherit;color:inherit}
/* Pas de zoom au double tap sur les boutons (taps rapides sur ±2,5). */
button,a,input,summary,label{touch-action:manipulation}
a{color:var(--accent)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== En-tête ===== */
header.haut{background:var(--entete);color:var(--entete-texte);
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  position:sticky;top:0;z-index:20}
header.haut h1{margin:0;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:.2px}
header.haut p{margin:2px 0 0;font-size:14px;color:#D4DDF0}
header.haut .retour{color:#fff;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin:-6px 0 -6px -4px;padding:0 4px;font-size:16px}

main{max-width:720px;margin:0 auto;padding:12px calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
.carte{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.carte h2{margin:0 0 6px;font-size:17px}
.sec{color:var(--texte2);font-size:15px}
.petit{font-size:14px;color:var(--texte2)}
.etiq{display:inline-block;border:1px solid var(--ligne);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--texte2);margin:0 6px 6px 0}
.etiq.fort{background:var(--marine);border-color:var(--marine);color:#fff}
.bandeau{border-left:4px solid var(--alerte);background:var(--alerte-fond);color:var(--texte);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.bandeau.err{border-left-color:var(--erreur)}
.bandeau b{color:var(--alerte)}
.bandeau a{display:inline-flex;align-items:center;min-height:44px}
.bandeau.err b{color:var(--erreur)}

/* ===== Boutons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:10px;
  border:1px solid var(--btn);background:var(--btn);color:var(--btn-texte);font-weight:600;font-size:17px;text-decoration:none;cursor:pointer}
.btn.large{width:100%}
.btn.second{background:transparent;color:var(--accent);border-color:var(--accent)}
.liste-seances{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ligne-seance{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 12px;border:1px solid var(--ligne);
  border-radius:10px;background:var(--surface2);color:var(--texte);text-decoration:none}
.ligne-seance b{display:block;font-size:16px}
.ligne-seance small{color:var(--texte2);font-size:14px}
.statut{font-size:14px;white-space:nowrap;border-radius:999px;padding:2px 10px;border:1px solid var(--ligne);color:var(--texte2)}
.statut.faite{background:var(--ok-fond);border-color:var(--ok);color:var(--ok);font-weight:600}
.statut.encours{border-color:var(--accent);color:var(--accent)}
.statut.manquee{border-color:var(--erreur);color:var(--erreur)}

/* ===== Séance ===== */
details.section{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;margin-bottom:12px}
details.section>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
  min-height:48px;padding:6px 14px;font-weight:700;font-size:16px;text-transform:none}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::after{content:"▾";color:var(--texte2);font-size:14px}
details.section:not([open])>summary::after{content:"▸"}
details.section>summary .compte{margin-left:auto;font-weight:500;color:var(--texte2);font-size:14px}
.ex{border-top:1px solid var(--ligne);padding:12px 14px}
.ex-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-nom{font-size:19px;font-weight:700;line-height:1.25;margin:0}
.ex-nom{flex:1;min-width:0}
.ex-charge{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;max-width:55%;overflow-wrap:anywhere}
.ex-charge.long{font-size:16px;font-weight:600}
.ex-presc{color:var(--texte2);font-size:15px;margin-top:2px}
details.rem{margin-top:4px}
details.rem>summary{cursor:pointer;color:var(--accent);font-size:15px;min-height:44px;display:flex;align-items:center;width:max-content}
details.rem p{margin:0 0 6px;font-size:15px;color:var(--texte2)}
/* Ligne de série en grille fluide : n° | −2,5 | charge | +2,5 | reps | faite (tient dans 375 px) */
.serie{display:grid;grid-template-columns:24px 44px minmax(52px,1fr) 44px minmax(48px,64px) 48px;gap:6px;align-items:center;margin-top:8px}
.serie.sans-kg{grid-template-columns:24px minmax(48px,90px) 1fr 48px}
.serie.tete{margin-top:10px;font-size:13px;color:var(--texte2)}
.serie.tete .c-kg{grid-column:2 / span 3;text-align:center}
.serie.tete .c-fait{text-align:center}
.serie .num{color:var(--texte2);font-size:14px;font-variant-numeric:tabular-nums}
.pas{width:44px;height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface2);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.serie input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface);text-align:center;
  font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.fait{width:48px;height:48px;border-radius:12px;border:2px solid var(--bord-champ);background:var(--surface);
  font-size:22px;line-height:1;color:transparent;cursor:pointer;padding:0;justify-self:end}
.fait[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){.fait[aria-pressed="true"]{color:#081029}}
.serie input::placeholder,.note::placeholder{color:var(--texte2);opacity:1;font-weight:500}
.serie.ok input{border-color:var(--ok)}
.rpe{margin-top:10px}
.rpe-l{font-size:14px;color:var(--texte2);margin-bottom:4px}
.rpe-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe-btns button{min-height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface2);font-size:17px;font-weight:700;cursor:pointer}
.rpe-btns button[aria-pressed="true"]{background:var(--btn);color:var(--btn-texte);border-color:var(--btn)}
.note{width:100%;margin-top:8px;min-height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface);padding:8px 10px;font-size:16px}
.case{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-top:1px solid var(--ligne);cursor:pointer}
.case input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--ok);margin:0}
.case b{font-weight:600}
.case .sec{display:block;font-size:14px}
.pied-seance{margin:16px 0 8px}
.etat-ecran{font-size:13px;color:var(--texte2);text-align:center;margin-top:8px}

/* ===== Minuteur de récupération (au-dessus de la barre d'onglets) ===== */
#minuteur{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:30;
  background:var(--marine);color:#fff;padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
#minuteur[hidden]{display:none}
body.avec-minuteur{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 90px)}
#minuteur .m-txt{flex:1;min-width:0}
#minuteur .m-lib{font-size:13px;color:#D4DDF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minuteur .m-temps{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#minuteur button{min-width:48px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#minuteur .barre{position:absolute;left:0;top:0;height:3px;background:var(--azur)}
#minuteur.fini{background:#1C6E40}
#minuteur.fini .barre{display:none}

/* ===== Barre d'onglets ===== */
nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--ligne);
  display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);
  color:var(--texte2);text-decoration:none;font-size:12px;font-weight:600}
nav.onglets a svg{width:24px;height:24px}
nav.onglets a[aria-current="page"]{color:var(--accent)}
nav.onglets a[aria-current="page"]::before{content:"";position:absolute;width:32px;height:3px;border-radius:2px;background:var(--accent);transform:translateY(-27px)}

/* Résumé */
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.chiffre{background:var(--surface2);border:1px solid var(--ligne);border-radius:10px;padding:10px;text-align:center}
.chiffre b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.chiffre span{font-size:13px;color:var(--texte2)}
/* ===== Étape 2 : programme, semaine, progression, suggestions ===== */
/* Couleurs des graphiques, validées (séparation daltonisme, contraste ≥ 3:1) sur la surface claire et sombre. */
:root{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root{--s1:#3987e5;--s2:#d95926}}
.courses{list-style:none;margin:0;padding:0}
.courses li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;min-height:44px;border-top:1px solid var(--ligne);padding:6px 0}
.courses li:first-child{border-top:0}
.courses .c-date{font-weight:700;font-variant-numeric:tabular-nums}
.courses .c-j{font-size:14px;color:var(--texte2);font-variant-numeric:tabular-nums;white-space:nowrap}
.courses li.principal .c-date{color:var(--accent)}
.courses .etiq{margin:0 0 0 4px;font-size:12px;padding:1px 8px}
.legende{margin:0 4px 10px}
.bloc h2{margin-bottom:0}
a.sem{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;min-height:56px;padding:8px 10px;margin-top:6px;
  border:1px solid var(--ligne);border-radius:10px;background:var(--surface2);color:var(--texte);text-decoration:none}
a.sem.cour{border:2px solid var(--accent);padding:7px 9px}
a.sem .sn{font-weight:800;font-size:17px}
a.sem .sm{font-size:15px;min-width:0}
a.sem .sm small{display:block;font-size:13px;color:var(--texte2)}
a.sem .sm small.crs{color:var(--texte);font-weight:600}
a.sem .etiq{margin:0 0 0 4px;font-size:12px;padding:1px 8px}
.pts{display:flex;gap:4px}
.pts .g{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:1.5px solid var(--bord-champ);color:var(--texte2)}
.pts .g.faite{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){.pts .g.faite{color:#081029}}
.pts .g.encours{border-color:var(--accent);color:var(--accent)}
.pts .g.manquee{border-color:var(--erreur);color:var(--erreur)}
label.f,p.f{display:block;font-size:14px;color:var(--texte2);margin:12px 0 4px;font-weight:600}
.champ-f{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface);padding:8px 10px;font-size:17px}
input.champ-f{max-width:140px;font-weight:700}
textarea.champ-f{resize:vertical;margin-bottom:10px}
.choix3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choix3 button{min-height:48px;border-radius:10px;border:1px solid var(--bord-champ);background:var(--surface2);font-size:15px;font-weight:600;cursor:pointer;padding:4px}
.choix3 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-texte);border-color:var(--btn)}
.suggs{list-style:none;margin:0;padding:0}
.sugg{border-top:1px solid var(--ligne);padding:8px 0;display:grid;grid-template-columns:112px 1fr;column-gap:10px;align-items:center}
.sugg-t{min-width:0}
.sugg-t .sec{display:block}
.sugg:first-child{border-top:0}
.sugg-d{font-weight:700;font-size:14px;border-radius:8px;padding:6px 8px;border:1.5px solid var(--bord-champ);max-width:130px;text-align:center}
.sugg.monter .sugg-d{border-color:var(--ok);color:var(--ok);background:var(--ok-fond)}
.sugg.maintenir .sugg-d{border-color:var(--accent);color:var(--accent)}
.sugg.reduire .sugg-d{border-color:var(--alerte);color:var(--alerte);background:var(--alerte-fond)}
.sugg.attente .sugg-d,.sugg.aucune .sugg-d{color:var(--texte2)}
.sugg .sec{font-size:14px}
.sugg small{color:var(--texte2)}
.chiffres.deux{grid-template-columns:repeat(2,1fr)}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--texte2);margin:2px 0 4px}
.leg span{display:inline-flex;align-items:center;gap:6px}
svg.graphe{display:block;width:100%;height:auto;overflow:visible}
.graphe .grille{stroke:var(--ligne);stroke-width:1}
.graphe .ax{fill:var(--texte2);font-size:12px}
.graphe .lab{fill:var(--texte);font-size:12px;font-weight:700}
.graphe .curseur{stroke:var(--texte2);stroke-width:1;stroke-dasharray:3 3}
.graphe .zone{fill:transparent;cursor:pointer}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.s1{stroke:var(--s1)} .trace.s2{stroke:var(--s2)}
.trace.pointille{stroke-dasharray:5 4}
.mq{stroke:var(--surface);stroke-width:2}
.mq.s1{fill:var(--s1)} .mq.s2{fill:var(--s2)}
.pointe{font-size:14px;color:var(--texte2);margin:4px 0 0;min-height:20px}
.vide-g{color:var(--texte2);font-size:15px;margin:4px 0}
.tab{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tab th,.tab td{border-top:1px solid var(--ligne);padding:4px 6px;text-align:right}
.tab th[scope="row"],.tab thead th:first-child{text-align:left}
.fracts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fracts li{display:flex;gap:8px;align-items:center;border:1px solid var(--ligne);border-radius:8px;padding:6px 8px;font-size:14px;color:var(--texte2)}
.fracts li b{color:var(--texte)}
.fracts li.qualite span{color:var(--ok);font-weight:600}
.fracts li.degrade span{color:var(--alerte);font-weight:600}
.fracts li.rate span{color:var(--erreur);font-weight:600}

/* ===== Étape 3 : données ===== */
.btn.danger{background:var(--erreur);border-color:var(--erreur);color:#fff}
@media (prefers-color-scheme: dark){.btn.danger{color:#081029}}
.confirm{margin-top:12px;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.confirm.danger{border-color:var(--erreur)}
.confirm p{margin:0 0 8px;font-size:15px}
/* Message d'état : bulle au-dessus de la barre d'onglets, visible quel que soit le défilement */
.msg{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);z-index:35;max-width:696px;margin:0 auto;
  background:#101C48;color:#fff;border:1px solid #3884C8;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.msg:empty{display:none}
.msg.err{background:#A3221B;border-color:#A3221B}
.rappel{margin:0 4px 12px;font-size:15px;color:var(--texte2)}
.rappel a{display:inline-flex;align-items:center;min-height:44px}
#maj{max-width:720px;margin:12px auto 0;padding:0 12px}
#maj .bandeau{margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#maj .btn{min-height:44px;font-size:15px}
@media (min-width:700px){ main{padding-top:20px} }
/* ===== Finition « verre » moderne (inspirée du verre d'iOS récent) =====
   Fond en halos de couleur fixes ; cartes en verre dépoli (flou + saturation) avec bord spéculaire
   (dégradé clair en biais) et reflet intérieur ; barre d'onglets en capsule flottante ; boutons qui
   s'enfoncent légèrement au toucher. Contrastes recalculés dans le pire cas (halo le plus foncé en clair,
   le plus clair en sombre, sous la carte) : texte ≥ 4,5:1, bords de champs ≥ 3:1. */
:root{
  --fond:#E6EDF8;
  --halo-a:rgba(56,132,200,.30); --halo-b:rgba(110,193,240,.28); --halo-c:rgba(16,28,72,.14);
  --verre-carte:rgba(255,255,255,.65); --verre-rangee:rgba(255,255,255,.55);
  --spec-1:rgba(255,255,255,.95); --spec-2:rgba(255,255,255,.25); --spec-3:rgba(255,255,255,.65);
  --reflet-int:rgba(255,255,255,.85); --bord-rangee:rgba(255,255,255,.7); --verre-ombre:rgba(16,28,72,.12);
  --verre-barre:rgba(255,255,255,.88); --verre-entete:rgba(16,28,72,.82); --verre-sombre:rgba(16,28,72,.86);
  --onglet-actif:rgba(39,102,163,.12); --bord-champ:#6E7B99;
  --btn-haut:#2C6CAA; --btn-bas:#225C94;
  --bas-barre:max(10px, env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#060C22;
    --halo-a:rgba(56,132,200,.30); --halo-b:rgba(110,193,240,.12); --halo-c:rgba(42,63,143,.45);
    --verre-carte:rgba(14,22,54,.6); --verre-rangee:rgba(23,35,77,.6);
    --spec-1:rgba(134,189,240,.45); --spec-2:rgba(134,189,240,.06); --spec-3:rgba(134,189,240,.22);
    --reflet-int:rgba(255,255,255,.08); --bord-rangee:rgba(134,189,240,.16); --verre-ombre:rgba(0,0,0,.4);
    --verre-barre:rgba(13,21,52,.84); --verre-entete:rgba(11,21,56,.84); --verre-sombre:rgba(11,21,56,.88);
    --onglet-actif:rgba(134,189,240,.16); --bord-champ:#6B7DB5;

<script>
'use strict';
/* =====================================================================
   Renfo Cross : suivi du programme de renforcement (PWA, sans dépendance).
   Le plan (exercices, charges, règles) vient de data/plan.json, généré par
   tools/build-plan.js à partir des CSV du Google Sheet. L'app n'invente rien :
   si une donnée manque dans le plan, elle l'affiche comme manquante.
   Les saisies restent dans ce navigateur (localStorage). Rien n'est envoyé.
   ===================================================================== */

var PLAN = null;          // contenu de plan.json
var D = null;             // saisies (voir donneesVides)
var CLE = 'renfo-cross-saisies-v1';
var ANCIENNE_CLE = 'renfo-cross-2026-v1'; // première version de l'app (format différent, non reprise)
var stockageOK = true;

/* ---------- Stockage local ---------- */
function donneesVides() {
  return {
    v: 1,
    seances: {},   // « S1-1 » : { debut, fin, faite, ex: { idExercice: { fait, series:[{kg,reps,ok,t}], rpe, note } } }
    semaines: {},  // « S1 » : { poids, fractionne }
    minuteur: null, // { fin (ms), total (s), lib }
    meta: {}       // { derniereSauvegarde (ms) }
  };
}
function charger() {
  try {
    var t = localStorage.getItem(CLE);
    D = t ? JSON.parse(t) : donneesVides();
  } catch (e) { stockageOK = false; D = donneesVides(); }
  if (!D || D.v !== 1) D = donneesVides();
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(D)); stockageOK = true; }
  catch (e) { stockageOK = false; afficherBandeauStockage(); }
}
function donneesSontVides() { return Object.keys(D.seances).length === 0 && Object.keys(D.semaines).length === 0; }
function ancienneVersionPresente() { try { return !!localStorage.getItem(ANCIENNE_CLE); } catch (e) { return false; } }

/* ---------- Dates (heure locale de l'appareil) ---------- */
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function dateISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function jourSeul(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function ajouterJours(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function memeJour(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function fmtJour(d) { return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fmtCourt(d) { return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
// Date du jour. Paramètre de test : index.html?jour=2026-11-12 simule une autre date.
function aujourdhui() {
  var m = location.search.match(/[?&]jour=(\d{4}-\d{2}-\d{2})/);
  return m ? dateISO(m[1]) : jourSeul(new Date());
}
function semaineDe(d) {
  for (var i = 0; i < PLAN.semaines.length; i++) {
    var s = PLAN.semaines[i];
    if (d >= dateISO(s.debut) && d <= dateISO(s.fin)) return s;
  }
  return null;
}
// Décalage depuis le lundi : lundi = 0 … dimanche = 6.
function decalage(jourIndex) { return (jourIndex + 6) % 7; }
function dateSeance(sem, n) { var t = PLAN.seancesType[n - 1]; return ajouterJours(dateISO(sem.debut), decalage(t.jourIndex)); }
function semaineParId(id) { for (var i = 0; i < PLAN.semaines.length; i++) if (PLAN.semaines[i].id === id) return PLAN.semaines[i]; return null; }
function seanceDuPlan(sem, n) { return sem && sem.seances ? sem.seances.filter(function (s) { return s.n === n; })[0] || null : null; }

/* ---------- Outils ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nombre(v) { if (v === '' || v == null) return null; var x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? null : x; }
function fmtNb(x) { return x == null ? '' : String(Math.round(x * 100) / 100).replace('.', ','); }
function cleSeance(semId, n) { return semId + '-' + n; }
function saisieSeance(semId, n) { return D.seances[cleSeance(semId, n)] || null; }
function annoncer(t) { var a = document.getElementById('annonce'); a.textContent = ''; setTimeout(function () { a.textContent = t; }, 50); }

// Statut d'une séance : faite / en cours / manquée / à faire.
function statutSeance(sem, n) {
  var s = saisieSeance(sem.id, n);
  if (s && s.faite) return { cle: 'faite', txt: 'Faite' };
  if (dateSeance(sem, n) < aujourdhui()) return s ? { cle: 'manquee', txt: 'Non terminée' } : { cle: 'manquee', txt: 'Manquée' };
  if (s) return { cle: 'encours', txt: 'En cours' };
  return { cle: '', txt: 'À faire' };
}

/* ---------- Navigation (hash) ---------- */
function route() {
  var h = location.hash.replace(/^#\/?/, '').split('/');
  libererEcran();
  if (h[0] !== 'donnees') { IMPORT_ATTENTE = null; RESET_ETAPE = 0; }
  document.querySelectorAll('nav.onglets a').forEach(function (a) { a.removeAttribute('aria-current'); });
  var onglet = 'aujourdhui';
  if (h[0] === 'seance' && h[1] && h[2]) { vueSeance(h[1], +h[2]); onglet = ''; }
  else if (h[0] === 'resume' && h[1] && h[2]) { vueResume(h[1], +h[2]); onglet = ''; }
  else if (h[0] === 'programme') { onglet = 'programme'; vueProgramme(); }
  else if (h[0] === 'semaine' && h[1]) { onglet = 'programme'; vueSemaine(h[1]); }
  else if (h[0] === 'progression') { onglet = 'progression'; vueProgression(); }
  else if (h[0] === 'donnees') { onglet = 'donnees'; vueDonnees(); }
  else vueAujourdhui();
  var lien = document.querySelector('nav.onglets a[data-onglet="' + onglet + '"]');
  if (lien) lien.setAttribute('aria-current', 'page');

  vue.classList.remove('entree'); void vue.offsetWidth; vue.classList.add('entree');
}
function entete(titre, sousTitre, retour) {
  document.getElementById('entete').innerHTML =
    (retour ? '<a class="retour" href="' + retour + '">‹ Retour</a>' : '') +
    '<h1>' + esc(titre) + '</h1>' + (sousTitre ? '<p>' + esc(sousTitre) + '</p>' : '');
}

/* ---------- Bandeaux d'information ---------- */
function bandeaux() {
  var h = '';
  if (!stockageOK) h += '<div class="bandeau err" role="alert"><b>Sauvegarde impossible.</b> Le stockage de ce navigateur refuse l\'écriture (mode privé ou espace plein). Tes saisies seront perdues à la fermeture.</div>';
  if (donneesSontVides()) {

  }

}

/* ---------- Écran AUJOURD'HUI ---------- */

/* ---------- Écran SÉANCE ---------- */
var COURANT = null; // { sem, n, detail, cle }

function saisieEx(id, creer) {
  var s = D.seances[COURANT.cle];
  if (!s) { if (!creer) return null; s = D.seances[COURANT.cle] = { debut: Date.now(), fin: null, faite: false, ex: {} }; }
  if (!s.debut) s.debut = Date.now();
  if (!s.ex[id]) { if (!creer) return null; s.ex[id] = { fait: false, series: [], rpe: null, note: '' }; }
  return s.ex[id];
}
function exParId(id) {
  var r = null;
  COURANT.detail.sections.forEach(function (sec) { sec.exercices.forEach(function (e) { if (e.id === id) r = e; }); });
  return r;
}
// Affiche la charge prévue telle qu'écrite dans le plan (texte exact du Sheet).
function libelleUnite(e) {
  if (e.p.unite === 's') return 's';
  if (e.p.unite === 'm') return 'm';
  return 'reps';
}
function aChargeSaisissable(e) { return e.charge.kg != null || e.charge.min != null || /kg/.test(e.chargePrevue); }

function htmlExercice(e) {
  var s = saisieEx(e.id, false);
  if (e.saisie === 'case') {
    var coche = s && s.fait;
    return '<label class="case"><input type="checkbox" data-a="case" data-ex="' + e.id + '"' + (coche ? ' checked' : '') + '>' +
      '<span><b>' + esc(e.nom) + '</b><span class="sec">' + esc([e.chargePrevue, e.prescription, e.remarques].filter(Boolean).join(' · ')) + '</span></span></label>';
  }
  var h = '<div class="ex" data-ex="' + e.id + '"><div class="ex-tete"><h3 class="ex-nom">' + esc(e.nom) + '</h3>' +
    (e.chargePrevue ? '<div class="ex-charge' + (e.chargePrevue.length > 12 ? ' long' : '') + '">' + esc(e.chargePrevue) + '</div>' : '') + '</div>' +
    '<div class="ex-presc">' + esc(e.prescription) + '</div>' +
    (e.remarques ? '<details class="rem"><summary>Remarques</summary><p>' + esc(e.remarques) + '</p></details>' : '');
  var kgOK = aChargeSaisissable(e), unite = libelleUnite(e), sk = kgOK ? '' : ' sans-kg';
  // En-tête des colonnes (une seule fois par exercice, pour garder les lignes étroites)
  h += '<div class="serie tete' + sk + '" aria-hidden="true"><span></span>' +
    (kgOK ? '<span class="c-kg">Charge (' + (e.charge.mult === 2 ? 'kg, ×2 haltères' : 'kg') + ')</span>' : '') +
    '<span>' + (unite === 'reps' ? 'Reps' : (unite === 's' ? 'Secondes' : 'Mètres')) + (e.p.repsTexte ? ' ' + esc(e.p.repsTexte) : '') + '</span>' +
    (kgOK ? '' : '<span></span>') + '<span class="c-fait">Faite</span></div>';
  for (var i = 0; i < e.p.series; i++) {
    var se = s && s.series[i];
    // Pré-remplissage : valeur saisie, sinon celle de la série précédente saisie, sinon la charge prévue (si valeur unique).
    var kg = se && se.kg != null ? se.kg : chargeParDefaut(e, s, i);
    var reps = se && se.reps != null ? se.reps : e.p.reps;
    h += '<div class="serie' + sk + (se && se.ok ? ' ok' : '') + '" data-i="' + i + '"><span class="num">S' + (i + 1) + '</span>' +
      (kgOK ? '<button type="button" class="pas" data-a="moins" aria-label="Moins 2,5 kg, série ' + (i + 1) + '">−2,5</button>' +
        '<input type="text" inputmode="decimal" autocomplete="off" data-a="kg" aria-label="Charge réalisée série ' + (i + 1) + ' en kg"' +
        ' value="' + esc(fmtNb(kg)) + '" placeholder="' + (e.charge.min != null ? esc(fmtNb(e.charge.min) + '-' + fmtNb(e.charge.max)) : 'kg') + '">' +
        '<button type="button" class="pas" data-a="plus" aria-label="Plus 2,5 kg, série ' + (i + 1) + '">+2,5</button>' : '') +
      '<input class="reps" type="text" inputmode="numeric" autocomplete="off" data-a="reps" aria-label="' + unite + ' réalisées série ' + (i + 1) + '"' +
      ' value="' + esc(reps == null ? '' : reps) + '" placeholder="' + unite + '">' + (kgOK ? '' : '<span></span>') +
      '<button type="button" class="fait" data-a="ok" aria-pressed="' + (se && se.ok ? 'true' : 'false') + '" aria-label="Série ' + (i + 1) + ' faite">✓</button></div>';
  }
  h += '<div class="rpe"><div class="rpe-l">RPE dernière série' + (e.p.rpeCible ? ' (cible ' + esc(e.p.rpeCible) + ')' : '') + '</div><div class="rpe-btns" role="group" aria-label="RPE dernière série, ' + esc(e.nom) + '">';
  for (var r = 6; r <= 10; r++) h += '<button type="button" data-a="rpe" data-v="' + r + '" aria-pressed="' + (s && s.rpe === r ? 'true' : 'false') + '">' + r + '</button>';
  h += '</div></div><input class="note" type="text" data-a="note" placeholder="Note" aria-label="Note, ' + esc(e.nom) + '" value="' + esc(s ? s.note : '') + '"></div>';

}
function chargeParDefaut(e, s, i) {
  if (s) for (var j = i - 1; j >= 0; j--) if (s.series[j] && s.series[j].kg != null) return s.series[j].kg;
  return e.charge.kg;
}
function compteSection(sec) {
  var faits = 0, total = 0, s = D.seances[COURANT.cle];
  sec.exercices.forEach(function (e) {
    var x = s && s.ex[e.id];
    if (e.saisie === 'case') { total++; if (x && x.fait) faits++; }
    else { total += e.p.series; if (x) faits += x.series.filter(function (v) { return v && v.ok; }).length; }
  });
  return faits + '/' + total;
}
function vueSeance(semId, n) {
  var sem = semaineParId(semId), t = PLAN.seancesType[n - 1];

  if (!detail) {
    var rb = PLAN.regles.sections.map(function (s) { return s.entrees; }).reduce(function (a, b) { return a.concat(b); }, []).filter(function (e) { return /^Blocs/.test(e.cle); })[0];
    document.getElementById('vue').innerHTML = '<div class="carte"><h2>Séance pas encore détaillée</h2><p class="sec">L\'onglet ' + esc(sem.id) + ' n\'est pas encore dans le plan.' +
      (rb ? ' Règles : « ' + esc(rb.texte) + ' »' : '') + '</p><p class="sec">Consigne de la semaine (onglet Plan) : ' + esc(sem.objectif) + '</p></div>';

  }

  var s = D.seances[COURANT.cle], h = bandeaux();
  if (s && s.faite) h += '<div class="bandeau" role="status"><b>Séance terminée.</b> Elle reste modifiable ; les changements sont enregistrés. <a href="#/resume/' + sem.id + '/' + n + '">Voir le résumé</a></div>';
  detail.sections.forEach(function (sec, k) {
    h += '<details class="section" open data-sec="' + k + '"><summary>' + esc(sec.nom) + (sec.minutes ? ' · ' + sec.minutes + ' min' : '') +
      '<span class="compte" data-compte="' + k + '">' + compteSection(sec) + '</span></summary>';

    h += '</details>';
  });

  h += '<div class="pied-seance"><button type="button" class="btn large" data-a="terminer">Terminer la séance</button>' +
    '<p class="etat-ecran" id="etat-ecran"></p></div>';
  var v = document.getElementById('vue');
  v.innerHTML = h;

}
function majCompteurs() {
  if (!COURANT) return;
  COURANT.detail.sections.forEach(function (sec, k) {
    var el = document.querySelector('[data-compte="' + k + '"]');
    if (el) el.textContent = compteSection(sec);
  });
}
// Enregistre la série i d'après les champs affichés (charge et reps lus dans la ligne).
function lireSerie(ligne, e, ok) {
  var x = saisieEx(e.id, true), i = +ligne.getAttribute('data-i');
  var kgIn = ligne.querySelector('[data-a="kg"]'), repsIn = ligne.querySelector('[data-a="reps"]');
  var prec = x.series[i] || {};
  while (x.series.length <= i) x.series.push(null);
  x.series[i] = {
    kg: kgIn ? nombre(kgIn.value) : null,
    reps: nombre(repsIn.value),
    ok: ok == null ? !!prec.ok : ok,
    t: Date.now()
  };
  return x.series[i];
}
// Quand la charge d'une série change, les séries suivantes jamais touchées suivent (affichage uniquement).
function propagerCharge(ligne, e) {
  var x = saisieEx(e.id, false), i = +ligne.getAttribute('data-i'), val = ligne.querySelector('[data-a="kg"]').value;
  var bloc = ligne.parentNode;
  bloc.querySelectorAll('.serie').forEach(function (l) {
    var j = +l.getAttribute('data-i');
    if (j > i && !(x && x.series[j])) l.querySelector('[data-a="kg"]').value = val;
  });
}
function surAction(ev) {
  var cible = ev.target.closest('[data-a]');
  if (cible && (actionDonnees(cible) || actionHorsSeance(cible))) return;
  if (!cible || !COURANT) { if (cible && cible.getAttribute('data-a') === 'rouvrir') rouvrir(); return; }
  var a = cible.getAttribute('data-a');
  if (a === 'terminer') { terminer(); return; }
  if (a === 'rouvrir') { rouvrir(); return; }
  var exEl = cible.closest('[data-ex]'); if (!exEl) return;
  var e = exParId(exEl.getAttribute('data-ex')); if (!e) return;
  var ligne = cible.closest('.serie');
  if (a === 'case') { saisieEx(e.id, true).fait = cible.checked; }
  else if (a === 'moins' || a === 'plus') {
    var inp = ligne.querySelector('[data-a="kg"]');
    var v = nombre(inp.value); if (v == null) v = e.charge.kg != null ? e.charge.kg : (e.charge.min != null ? e.charge.min : 0);
    v = Math.max(0, v + (a === 'plus' ? 2.5 : -2.5));
    inp.value = fmtNb(v);
    lireSerie(ligne, e); propagerCharge(ligne, e);
  }
  else if (a === 'ok') {
    var dejaOk = cible.getAttribute('aria-pressed') === 'true';
    var se = lireSerie(ligne, e, !dejaOk);
    cible.setAttribute('aria-pressed', se.ok ? 'true' : 'false');
    ligne.classList.toggle('ok', se.ok);
    debloquerSon();
    if (se.ok) {
      if (e.p.recupSec) demarrerMinuteur(e.p.recupSec, e.nom + ' · S' + (+ligne.getAttribute('data-i') + 1) + ' faite');
      annoncer('Série ' + (+ligne.getAttribute('data-i') + 1) + ' faite' + (e.p.recupSec ? ', récupération ' + e.p.recupTexte : ''));
    }
  }
  else if (a === 'rpe') {
    var x = saisieEx(e.id, true), r = +cible.getAttribute('data-v');
    x.rpe = x.rpe === r ? null : r; // second tap : efface
    cible.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-v') === x.rpe ? 'true' : 'false'); });
  }
  else return;
  sauver(); majCompteurs();
}
function surSaisie(ev) {
  var cible = ev.target, a = cible.getAttribute('data-a');
  if (a && saisieSemaine(cible)) return;
  if (!COURANT || !a) return;
  var exEl = cible.closest('[data-ex]'); if (!exEl) return;
  var e = exParId(exEl.getAttribute('data-ex')); if (!e) return;
  if (a === 'kg' || a === 'reps') { var l = cible.closest('.serie'); lireSerie(l, e); if (a === 'kg') propagerCharge(l, e); }
  else if (a === 'note') saisieEx(e.id, true).note = cible.value;
  else return;
  sauver();
}

/* ---------- Fin de séance et résumé ---------- */
function terminer() {
  var s = D.seances[COURANT.cle] || (D.seances[COURANT.cle] = { debut: null, fin: null, faite: false, ex: {} });
  s.faite = true; if (!s.fin) s.fin = Date.now();
  sauver(); arreterMinuteur();
  location.hash = '#/resume/' + COURANT.sem.id + '/' + COURANT.n;
}
function rouvrir() {
  var h = location.hash.split('/'), cle = cleSeance(h[2], +h[3]), s = D.seances[cle];
  if (s) { s.faite = false; s.fin = null; sauver(); }
  location.hash = '#/seance/' + h[2] + '/' + h[3];
}
// Calculs du résumé. Volume = Σ charge × répétitions des séries faites, charge × 2 quand le plan indique deux haltères
// (« 2 × 10 kg », « … par main »). Les séries en secondes ou en mètres ne comptent pas dans le volume.
function resumeSeance(semId, n) {
  var sem = semaineParId(semId), detail = seanceDuPlan(sem, n), s = saisieSeance(semId, n) || { ex: {} };
  var volume = 0, rpes = [], faites = 0, prevues = 0;
  detail.sections.forEach(function (sec) {
    sec.exercices.forEach(function (e) {
      if (e.saisie !== 'series') return;
      prevues += e.p.series;
      var x = s.ex[e.id]; if (!x) return;
      if (x.rpe != null) rpes.push(x.rpe);
      x.series.forEach(function (se) {
        if (!se || !se.ok) return;
        faites++;
        if (se.kg != null && se.reps != null && e.p.unite !== 's' && e.p.unite !== 'm') volume += se.kg * e.charge.mult * se.reps;
      });
    });
  });
  return {
    volume: volume, faites: faites, prevues: prevues,
    rpeMoyen: rpes.length ? rpes.reduce(function (a, b) { return a + b; }, 0) / rpes.length : null, nbRpe: rpes.length,
    dureeMin: s.debut && s.fin ? Math.round((s.fin - s.debut) / 60000) : null
  };
}
function vueResume(semId, n) {
  var sem = semaineParId(semId), t = PLAN.seancesType[n - 1];
  if (!sem || !seanceDuPlan(sem, n)) { route0(); return; }
  var r = resumeSeance(semId, n);
  entete('Résumé · ' + sem.id + ' · ' + t.nom, fmtJour(dateSeance(sem, n)), '#/');
  var duree = r.dureeMin == null ? '—' : (r.dureeMin >= 60 ? Math.floor(r.dureeMin / 60) + ' h ' + String(r.dureeMin % 60).padStart(2, '0') : r.dureeMin + ' min');
  document.getElementById('vue').innerHTML = bandeaux() +
    '<div class="carte"><h2>Séance enregistrée</h2><div class="chiffres">' +
    '<div class="chiffre"><b>' + fmtNb(Math.round(r.volume)) + '</b><span>kg de volume</span></div>' +
    '<div class="chiffre"><b>' + (r.rpeMoyen == null ? '—' : fmtNb(Math.round(r.rpeMoyen * 10) / 10)) + '</b><span>RPE moyen</span></div>' +
    '<div class="chiffre"><b>' + duree + '</b><span>durée</span></div></div>' +
    '<p class="petit">' + r.faites + ' séries faites sur ' + r.prevues + ' prévues. RPE moyen sur ' + r.nbRpe + ' exercice(s) noté(s). ' +
    'Volume : somme charge × répétitions des séries cochées (× 2 quand le plan indique deux haltères ; séries en secondes ou en mètres exclues). ' +
    'Durée : de la première saisie au bouton « Terminer ».</p>' +
    '<div class="liste-seances"><a class="btn large" href="#/">Retour à aujourd\'hui</a>' +
    '<button type="button" class="btn second large" data-a="rouvrir">Rouvrir la séance</button></div></div>' +
    htmlSuggestions(sem, [n], 'Suggestions pour la semaine suivante');
}
function route0() { location.hash = '#/'; }

/* ---------- Bilan de la semaine (onglet Plan : poids, qualité du fractionné, retour coureur) ----------
   Douleur et mauvais sommeil sont aussi notés par semaine : la règle « Réduire » de l'onglet Règles
   les cite comme motifs de baisse des charges pour la semaine suivante. */
var FRACT = [
  { v: 'qualite', lib: 'De qualité', sym: '✓' },
  { v: 'degrade', lib: 'Un peu dégradé', sym: '~' },
  { v: 'rate', lib: 'Raté', sym: '✗' }
];
function bilan(semId) { return D.semaines[semId] || {}; }
function bilanEcrit(semId) { return D.semaines[semId] || (D.semaines[semId] = { poids: null, fractionne: null, douleur: false, sommeil: false, retour: '' }); }
function htmlCasesSemaine(semId) {
  var b = bilan(semId);

/* ---------- Règles de décision (lues dans plan.json, issues de l'onglet Règles) ----------
   Ordre d'application : Réduire (un seul motif suffit), puis Maintenir, puis Monter.
   Le RPE est celui de la dernière série (définition de l'onglet Règles).
   « Toutes les séries réussies » = toutes les séries prévues cochées, avec au moins les répétitions prévues. */
function suggestion(sem, e, x) {
  var R = PLAN.regles.decision, b = bilan(sem.id);

  var reduire = [];
  if (x.rpe >= R.reduire.rpeMin) reduire.push('RPE ' + x.rpe);
  if (R.reduire.douleur && b.douleur) reduire.push('douleur');
  if (R.reduire.sommeil && b.sommeil) reduire.push('mauvais sommeil');
  if (R.reduire.fractionne && b.fractionne === 'rate') reduire.push('fractionné raté');
  if (reduire.length) return { cle: 'reduire', lib: 'Réduire', sym: '▼', pourquoi: reduire.join(', ') + '.' };
  if (x.rpe === R.maintenir.rpe) return { cle: 'maintenir', lib: 'Maintenir', sym: '=', pourquoi: 'RPE ' + x.rpe + '.' };
  if (R.maintenir.fractionne && b.fractionne === 'degrade') return { cle: 'maintenir', lib: 'Maintenir', sym: '=', pourquoi: 'fractionné un peu dégradé.' };
  if (x.rpe <= R.monter.rpeMax) {

    }

    return { cle: 'attente', lib: 'Monter si le fractionné est de qualité', sym: '?', pourquoi: 'toutes les séries réussies, RPE ' + x.rpe + ' ; qualité du fractionné de mercredi non saisie.' };

}
// Exercices concernés : ceux qui se saisissent par série et ont une charge (ou font partie des exercices clés, ex. tractions).

  if (cour) nMax = Math.max(nMax, cour.n);

  Object.keys(D.seances).concat(Object.keys(D.semaines)).forEach(function (k) { var m = k.match(/^S(\d+)/); if (m) nMax = Math.max(nMax, +m[1]); });

// Meilleures valeurs d'une semaine pour un exercice clé, sur les séries cochées « faite ».

function valeursExercice(cle) {
  var res = { charge: {}, e1rm: {}, reps: {}, aCharge: false };
  PLAN.semaines.forEach(function (sem) {
    (sem.seances || []).forEach(function (se) {
      var s = saisieSeance(sem.id, se.n); if (!s) return;
      se.sections.forEach(function (sec) {
        sec.exercices.forEach(function (e) {
          if (e.cle !== cle) return;

          var x = s.ex[e.id]; if (!x) return;
          x.series.forEach(function (v) {
            if (!v || !v.ok) return;
            if (v.reps != null) res.reps[sem.n] = Math.max(res.reps[sem.n] || 0, v.reps);
            if (v.kg == null) return;

            if (v.reps != null && v.reps > 0) res.e1rm[sem.n] = Math.max(res.e1rm[sem.n] || 0, Math.round(kg * (1 + v.reps / 30) * 10) / 10);
          });

}

function mouvementReduit() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
// Compteurs : les nombres défilent de 0 à leur valeur (data-compte, data-dec = décimales, data-avant / data-apres = texte autour).
function animerCompteurs(racine) {
  var els = racine.querySelectorAll('[data-compte]');
  function ecrire(el, v) { var d = +el.getAttribute('data-dec') || 0; el.textContent = (el.getAttribute('data-avant') || '') + fmtNb(Math.round(v * Math.pow(10, d)) / Math.pow(10, d)) + (el.getAttribute('data-apres') || ''); }
  if (mouvementReduit() || !window.requestAnimationFrame) { els.forEach(function (el) { ecrire(el, +el.getAttribute('data-compte')); }); return; }

// Histogramme vertical : une barre par semaine, ancrée sur la ligne de base, qui monte à l'ouverture.
function histogramme(id, ns, pts, unite) {

  var W = 340, H = 180, L = 40, R = 10, T = 14, B = 26, mx = Math.max.apply(null, vals);

// Chiffres clés d'un exercice : dernière valeur, évolution depuis la première semaine renseignée, record.

  var src = v.aCharge ? v.e1rm : v.reps, ks = Object.keys(src).map(Number).sort(function (a, b) { return a - b; });
  if (!ks.length) return '';
  var dern = src[ks[ks.length - 1]], prem = src[ks[0]], h = '<div class="stats">';
  h += '<div class="stat"><b>' + compteur(dern, v.aCharge ? 1 : 0, '', v.aCharge ? ' kg' : '') + '</b><span>' + (v.aCharge ? 'e1RM' : 'reps') + ' en S' + ks[ks.length - 1] + '</span></div>';
  if (ks.length > 1 && prem > 0) {
    var ev = Math.round(1000 * (dern - prem) / prem) / 10;
    h += '<div class="stat ' + (ev > 0 ? 'hausse' : (ev < 0 ? 'baisse' : '')) + '"><b><span aria-hidden="true">' + (ev > 0 ? '▲ ' : (ev < 0 ? '▼ ' : '= ')) + '</span>' + compteur(Math.abs(ev), 1, ev > 0 ? '+' : (ev < 0 ? '−' : ''), ' %') + '</b><span>depuis S' + ks[0] + '</span></div>';
  } else h += '<div class="stat"><b>—</b><span>évolution : 2 semaines nécessaires</span></div>';
  var rec = v.aCharge ? Math.max.apply(null, Object.keys(v.charge).map(function (k) { return v.charge[k]; })) : Math.max.apply(null, ks.map(function (k) { return src[k]; }));
  h += '<div class="stat"><b>' + compteur(rec, v.aCharge ? 1 : 0, '', v.aCharge ? ' kg' : '') + '</b><span>' + (v.aCharge ? 'meilleure charge' : 'record') + '</span></div>';
  return h + '</div>';
}
function vueProgression() {

/* ---------- Graphique en courbes (SVG écrit à la main) ----------
   Un seul axe (même unité pour toutes les séries), lignes de 2 px, marqueurs différents par série
   (rond plein / carré), seconde série en pointillé, étiquette directe au dernier point,
   légende au-dessus, tableau des valeurs. Un tap sur une semaine affiche ses valeurs. */
var GRAPHES = {};
// Pas de graduation « rond » (1, 2, 2,5 ou 5 × une puissance de 10) pour 4 intervalles au plus, 0,5 au minimum.
function pasLisible(etendue) {
  var brut = etendue / 4, p = Math.pow(10, Math.floor(Math.log(brut) / Math.LN10)), m = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < m.length; i++) if (m[i] * p >= brut) return Math.max(0.5, m[i] * p);
  return Math.max(0.5, 10 * p);
}
function graphique(id, ns, series, unite) {
  var vals = [];
  series.forEach(function (s) { ns.forEach(function (n) { if (s.pts[n] != null) vals.push(s.pts[n]); }); });
  if (!vals.length) return '<p class="vide-g">Pas encore de données. Elles apparaissent quand tu coches des séries « faites »' + (unite === 'kg' && series.length > 1 ? ' avec une charge et des répétitions' : '') + '.</p>';
  GRAPHES[id] = { ns: ns, series: series, unite: unite };
  var W = 340, H = 200, L = 34, R = 62, T = 12, B = 26;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var pas = pasLisible(Math.max(mx - mn, 1));
  var y0 = Math.floor(mn / pas) * pas, y1 = Math.ceil(mx / pas) * pas;
  if (y1 - y0 < pas * 2) { y0 -= pas; y1 += pas; }
  if (y0 < 0) y0 = 0;
  var X = function (n) { return ns.length < 2 ? L + (W - L - R) / 2 : L + (ns.indexOf(n) / (ns.length - 1)) * (W - L - R); };
  var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="graphe" role="img" aria-label="' + esc(series.map(function (s) { return s.nom; }).join(' et ')) + ' par semaine, en ' + unite + '">';
  // Grille horizontale et axe des valeurs
  for (var v = y0; v <= y1 + 1e-9; v += pas) svg += '<line class="grille" x1="' + L + '" x2="' + (W - R + 8) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fmtNb(v) + '</text>';
  // Axe des semaines (une sur deux au-delà de 8)
  ns.forEach(function (n, i) { if (ns.length <= 8 || i % 2 === 0 || i === ns.length - 1) svg += '<text class="ax" x="' + X(n) + '" y="' + (H - 8) + '" text-anchor="middle">S' + n + '</text>'; });
  svg += '<line class="curseur" id="' + id + '-c" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" visibility="hidden"/>';
  // Séries : segments entre semaines consécutives renseignées, puis marqueurs
  var etiquettes = [];
  series.forEach(function (s) {
    var d = '', prec = null;
    ns.forEach(function (n) {
      if (s.pts[n] == null) { prec = null; return; }
      d += (prec == null ? 'M' : 'L') + X(n).toFixed(1) + ' ' + Y(s.pts[n]).toFixed(1) + ' ';
      prec = n;

    // Ligne pleine : se dessine de gauche à droite ; ligne pointillée : apparaît en fondu.
    svg += '<path class="trace ' + s.cls + (s.pointille ? ' pointille apparait' : ' dessine') + '"' + (s.pointille ? '' : ' pathLength="1"') + ' d="' + d + '"/>';
    var dernier = null, k = 0;
    ns.forEach(function (n) {
      if (s.pts[n] == null) return;
      var x = X(n), y = Y(s.pts[n]); dernier = n;
      var st = ' style="animation-delay:' + (250 + 70 * k++) + 'ms"';
      svg += s.forme === 'carre' ? '<rect class="mq pose ' + s.cls + '"' + st + ' x="' + (x - 4.5) + '" y="' + (y - 4.5) + '" width="9" height="9" rx="1"/>' : '<circle class="mq pose ' + s.cls + '"' + st + ' cx="' + x + '" cy="' + y + '" r="4.5"/>';
    });
    if (dernier != null) etiquettes.push({ x: X(dernier) + 8, y: Y(s.pts[dernier]) + 4, t: (series.length > 1 ? s.nom + ' ' : '') + fmtNb(s.pts[dernier]) });
  });

  etiquettes.forEach(function (e) { svg += '<text class="lab apparait-tard" x="' + e.x + '" y="' + e.y + '">' + esc(e.t) + '</text>'; });

  ns.forEach(function (n) { svg += '<rect class="zone" data-a="col" data-g="' + id + '" data-n="' + n + '" x="' + (X(n) - larg / 2) + '" y="0" width="' + larg + '" height="' + H + '"/>'; });
  svg += '</svg>';
  var leg = series.length > 1 ? '<div class="leg">' + series.map(function (s) {
    return '<span><svg width="26" height="12" aria-hidden="true"><line class="trace ' + s.cls + (s.pointille ? ' pointille' : '') + '" x1="1" x2="25" y1="6" y2="6"/>' +
      (s.forme === 'carre' ? '<rect class="mq ' + s.cls + '" x="9" y="2" width="8" height="8" rx="1"/>' : '<circle class="mq ' + s.cls + '" cx="13" cy="6" r="4"/>') + '</svg>' + esc(s.nom) + '</span>';
  }).join('') + '</div>' : '';
  var tab = '<details class="rem"><summary>Valeurs</summary><table class="tab"><thead><tr><th scope="col">Semaine</th>' +
    series.map(function (s) { return '<th scope="col">' + esc(s.nom) + ' (' + unite + ')</th>'; }).join('') + '</tr></thead><tbody>';
  ns.forEach(function (n) { tab += '<tr><th scope="row">S' + n + '</th>' + series.map(function (s) { return '<td>' + (s.pts[n] == null ? '—' : fmtNb(s.pts[n])) + '</td>'; }).join('') + '</tr>'; });
  tab += '</tbody></table></details>';
  return leg + svg + '<p class="pointe" id="' + id + '-p" aria-live="polite">Touche une semaine pour voir ses valeurs.</p>' + tab;

function montrerPoint(id, n) {

  if (z && c) { var x = +z.getAttribute('x') + +z.getAttribute('width') / 2; c.setAttribute('x1', x); c.setAttribute('x2', x); c.setAttribute('visibility', 'visible'); }
  document.getElementById(id + '-p').textContent = 'S' + n + ' · ' + g.series.map(function (s) { return s.nom + ' : ' + (s.pts[n] == null ? 'pas de donnée' : fmtNb(s.pts[n]) + ' ' + g.unite); }).join(' · ');

/* ---------- Écran DONNÉES : export, copie, import, réinitialisation ----------
   Tout se passe dans le navigateur : aucun envoi réseau. Les fichiers sont proposés via la feuille
   de partage (iPhone : « Enregistrer dans Fichiers ») quand elle accepte les fichiers, sinon téléchargés. */
var IMPORT_ATTENTE = null;   // sauvegarde lue, en attente de confirmation
var RESET_ETAPE = 0;         // 0 = rien, 1 = confirmation demandée
var VERSION_APP = '';        // nom du cache du service worker (renfo-cross-vN)

function jjmmaaaa(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }

// Date d'une séance : jour de la première saisie si elle existe, sinon jour prévu au plan.
function dateSaisie(semId, n) {
  var s = saisieSeance(semId, n), sem = semaineParId(semId);
  if (s && s.debut) return new Date(s.debut);
  return sem && PLAN.seancesType[n - 1] ? dateSeance(sem, n) : null;
}
var COLONNES = ['Semaine', 'Séance', 'Date', 'Exercice', 'Charge prévue', 'Série', 'Charge réalisée (kg)', 'Reps', 'Faite', 'RPE dernière série', 'Note'];
// Une ligne par série saisie. RPE et note (propres à l'exercice) sont sur la dernière série saisie.
// Les saisies dont l'exercice n'existe plus dans le plan (plan régénéré) sont exportées quand même.
function lignesExport() {
  var lignes = [];
  Object.keys(D.seances).sort(function (a, b) {
    var x = a.match(/^S(\d+)-(\d+)$/) || [0, 0, 0], y = b.match(/^S(\d+)-(\d+)$/) || [0, 0, 0];
    return (+x[1] - +y[1]) || (+x[2] - +y[2]);
  }).forEach(function (cle) {
    var m = cle.match(/^(S\d+)-(\d+)$/); if (!m) return;
    var semId = m[1], n = +m[2], s = D.seances[cle], sem = semaineParId(semId), detail = seanceDuPlan(sem, n);
    var nomSeance = PLAN.seancesType[n - 1] ? PLAN.seancesType[n - 1].nom : 'Séance ' + n;
    var d = dateSaisie(semId, n), date = d ? jjmmaaaa(d) : '';
    var ordre = [], vus = {};
    if (detail) detail.sections.forEach(function (sec) { sec.exercices.forEach(function (e) { ordre.push(e); vus[e.id] = true; }); });
    Object.keys(s.ex || {}).forEach(function (id) { if (!vus[id]) ordre.push({ id: id, nom: id + ' (absent du plan actuel)', chargePrevue: '', saisie: (s.ex[id].series || []).length ? 'series' : 'case' }); });
    ordre.forEach(function (e) {

      if (e.saisie === 'case') { lignes.push(base.concat(['', '', '', x.fait ? 'oui' : 'non', '', x.note || ''])); return; }
      var idx = [];
      (x.series || []).forEach(function (se, i) { if (se) idx.push(i); });
      if (!idx.length) { lignes.push(base.concat(['', '', '', '', x.rpe == null ? '' : x.rpe, x.note || ''])); return; }
      idx.forEach(function (i, k) {
        var se = x.series[i], der = k === idx.length - 1;
        lignes.push(base.concat([i + 1, se.kg == null ? '' : se.kg, se.reps == null ? '' : se.reps, se.ok ? 'oui' : 'non',

var COLONNES_BILAN = ['Semaine', 'Poids (kg)', 'Qualité du fractionné', 'Douleur', 'Mauvais sommeil', 'Retour coureur'];
function lignesBilan() {
  return PLAN.semaines.filter(function (s) { return D.semaines[s.id]; }).map(function (s) {
    var b = D.semaines[s.id], f = FRACT.filter(function (x) { return x.v === b.fractionne; })[0];
    return [s.id, b.poids == null ? '' : b.poids, f ? f.lib : '', b.douleur ? 'oui' : '', b.sommeil ? 'oui' : '', b.retour || ''];

// Mise en texte : virgule décimale (Sheet et Excel en français). sep = ';' pour un fichier CSV, '\t' pour coller dans le Sheet.
function enTexte(entetes, lignes, sep) {
  function cell(v) {
    var t = typeof v === 'number' ? String(v).replace('.', ',') : String(v == null ? '' : v);
    if (sep === '\t') return t.replace(/[\t\r\n]+/g, ' ');
    return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;

function sauvegardeJSON() {

// Proposer un fichier : feuille de partage si possible (iPhone), sinon téléchargement. Renvoie une promesse « true » si c'est fait.

    var f = new File([blob], nom, { type: type });

// Lecture d'une sauvegarde : accepte le fichier exporté par l'app (enveloppe « renfo-cross ») ou l'objet de données seul.
function lireSauvegarde(texte) {

  if (d.semaines != null && (typeof d.semaines !== 'object' || Array.isArray(d.semaines))) throw new Error('la partie « semaines » est illisible.');
  Object.keys(d.seances).forEach(function (k) {

}
function vueDonnees() {

    '<p class="petit" id="persist" style="margin:6px 0 0"></p></div>';
  h += '<div class="carte"><h2>Copier pour le Sheet</h2><p class="sec" style="margin:0 0 10px">Une ligne par série, colonnes séparées par des tabulations : colle directement dans une feuille Google Sheets.</p>' +
    '<div class="liste-seances"><button type="button" class="btn large" data-a="copier">Copier les séries</button>' +
    '<button type="button" class="btn second large" data-a="copier-bilan">Copier les bilans de semaine</button></div></div>';
  h += '<div class="carte"><h2>Exporter</h2><p class="sec" style="margin:0 0 10px">CSV : séparateur « ; », virgule décimale, UTF-8. JSON : sauvegarde complète, à réimporter ici.</p>' +
    '<div class="liste-seances"><button type="button" class="btn large" data-a="exp-json">Sauvegarde JSON</button>' +
    '<button type="button" class="btn second large" data-a="exp-csv">Séries en CSV</button>' +
    '<button type="button" class="btn second large" data-a="exp-bilan">Bilans en CSV</button></div></div>';
  h += '<div class="carte"><h2>Restaurer une sauvegarde</h2><p class="sec" style="margin:0 0 10px">Remplace toutes les données de cet appareil par celles du fichier JSON.</p>' +
    '<label class="btn second large" for="fichier-import">Choisir un fichier JSON</label><input class="vh" id="fichier-import" type="file" accept="application/json,.json">';
  if (IMPORT_ATTENTE) {
    h += '<div class="confirm" role="group" aria-label="Confirmer la restauration"><p><b>Fichier lu :</b> ' + esc(compteDonnees(IMPORT_ATTENTE.donnees)) +
      (IMPORT_ATTENTE.exporteLe ? ', exporté le ' + esc(new Date(IMPORT_ATTENTE.exporteLe).toLocaleString('fr-FR')) : '') + '.</p>' +
      '<p>Les données actuelles de cet appareil (' + esc(compteDonnees(D)) + ') seront remplacées.</p>' +
      '<div class="liste-seances"><button type="button" class="btn large" data-a="import-ok">Remplacer mes données</button>' +
      '<button type="button" class="btn second large" data-a="import-annuler">Annuler</button></div></div>';
  }
  h += '</div>';
  h += '<div class="carte"><h2>Réinitialiser</h2>';
  if (RESET_ETAPE === 0) h += '<p class="sec" style="margin:0 0 10px">Efface toutes les saisies de cet appareil. Le plan n\'est pas touché.</p><button type="button" class="btn danger large" data-a="reset1">Tout effacer…</button>';
  else h += '<div class="confirm danger" role="alertdialog" aria-label="Confirmer l\'effacement"><p><b>Effacer définitivement</b> ' + esc(compteDonnees(D)) + ' ? Exporte d\'abord une sauvegarde JSON si tu veux pouvoir revenir en arrière.</p>' +
    '<div class="liste-seances"><button type="button" class="btn danger large" data-a="reset2">Oui, tout effacer</button>' +
    '<button type="button" class="btn second large" data-a="reset0">Annuler</button></div></div>';
  h += '</div>';
  h += '<p class="msg" id="msg-donnees" role="status"></p>';
  h += '<div class="carte"><h2>À propos</h2><p class="petit" style="margin:0">Plan généré le ' + esc(new Date(PLAN.genereLe).toLocaleString('fr-FR')) + ' depuis ' + esc(PLAN.sources.join(', ')) + '.<br>' +
    'Version de l\'app : <span id="version-app">' + esc(VERSION_APP || 'inconnue (service worker inactif)') + '</span>. Aucune donnée n\'est envoyée sur internet.</p></div>';
  document.getElementById('vue').innerHTML = h;
  document.getElementById('fichier-import').addEventListener('change', surFichierImport);
  // État du stockage persistant (sans garantie sur iOS, qui peut effacer les données d'une app peu utilisée).
  try {
    if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (p) {
      var el = document.getElementById('persist'); if (el) el.textContent = 'Stockage persistant : ' + (p ? 'accordé par le navigateur.' : 'non accordé : exporte une sauvegarde chaque semaine.');
    });
  } catch (e) {}
}
function surFichierImport(ev) {
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try { IMPORT_ATTENTE = lireSauvegarde(String(r.result)); RESET_ETAPE = 0; vueDonnees(); message('Fichier lu : vérifie puis confirme.'); }
    catch (e) { IMPORT_ATTENTE = null; vueDonnees(); message('Import impossible : ' + e.message, true); }
  };
  r.onerror = function () { message('Lecture du fichier impossible.', true); };
  r.readAsText(f);
}
function actionDonnees(cible) {
  var a = cible.getAttribute('data-a'), date = isoLocal(new Date());
  if (a === 'copier' || a === 'copier-bilan') {
    var lignes = a === 'copier' ? lignesExport() : lignesBilan();
    if (!lignes.length) { message('Rien à copier pour l\'instant.', true); return true; }
    copierTexte(enTexte(a === 'copier' ? COLONNES : COLONNES_BILAN, lignes, '\t')).then(function (ok) {
      message(ok ? lignes.length + ' ligne(s) copiée(s) : colle-les dans le Sheet.' : 'Copie refusée par le navigateur.', !ok);
    });
    return true;
  }
  if (a === 'exp-csv' || a === 'exp-bilan') {
    var l = a === 'exp-csv' ? lignesExport() : lignesBilan();
    // BOM UTF-8 : Excel affiche correctement les accents.
    proposerFichier('renfo-cross-' + (a === 'exp-csv' ? 'series' : 'bilans') + '-' + date + '.csv', 'text/csv;charset=utf-8', '﻿' + enTexte(a === 'exp-csv' ? COLONNES : COLONNES_BILAN, l, ';'))
      .then(function (ok) { if (ok) message(l.length + ' ligne(s) exportée(s).'); });
    return true;
  }
  if (a === 'exp-json') {
    proposerFichier('renfo-cross-sauvegarde-' + date + '.json', 'application/json', sauvegardeJSON()).then(function (ok) {
      if (!ok) return;
      if (!D.meta) D.meta = {};
      D.meta.derniereSauvegarde = Date.now(); sauver(); vueDonnees(); message('Sauvegarde JSON exportée.');
    });
    return true;
  }
  if (a === 'import-ok' && IMPORT_ATTENTE) {
    D = IMPORT_ATTENTE.donnees; IMPORT_ATTENTE = null; arreterMinuteur(); sauver(); vueDonnees(); message('Sauvegarde restaurée : ' + compteDonnees(D) + '.');
    return true;
  }
  if (a === 'import-annuler') { IMPORT_ATTENTE = null; vueDonnees(); message('Restauration annulée.'); return true; }
  if (a === 'reset1') { RESET_ETAPE = 1; IMPORT_ATTENTE = null; vueDonnees(); var b = document.querySelector('[data-a="reset0"]'); if (b) b.focus(); return true; }
  if (a === 'reset0') { RESET_ETAPE = 0; vueDonnees(); message('Effacement annulé.'); return true; }
  if (a === 'reset2' && RESET_ETAPE === 1) {
    RESET_ETAPE = 0; arreterMinuteur(); D = donneesVides(); sauver(); vueDonnees(); message('Toutes les saisies ont été effacées.');
    return true;
  }
  if (a === 'recharger') { location.reload(); return true; }
  return false;
}
// Rappel discret le dimanche si la dernière sauvegarde JSON date de plus de 6 jours (ou n'existe pas).
function htmlRappelSauvegarde(auj) {
  if (auj.getDay() !== 0 || donneesSontVides()) return '';
  var der = D.meta && D.meta.derniereSauvegarde;
  if (der && auj - jourSeul(new Date(der)) < 6 * 864e5) return '';
  return '<p class="rappel"><a href="#/donnees">Dimanche : pense à exporter ta sauvegarde JSON</a> (' + (der ? 'dernière le ' + esc(new Date(der).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })) : 'aucune pour l\'instant') + ').</p>';
}
// Nouvelle version installée par le service worker pendant que l'app est ouverte.
function surveillerMiseAJour(reg) {
  var avait = !!navigator.serviceWorker.controller;
  reg.addEventListener('updatefound', function () {
    var w = reg.installing; if (!w || !avait) return;
    w.addEventListener('statechange', function () {
      if (w.state !== 'activated') return;
      var el = document.getElementById('maj');
      el.innerHTML = '<div class="bandeau" role="status"><b>Nouvelle version installée.</b> Tes saisies sont conservées. <button type="button" class="btn second" data-a="recharger">Recharger</button></div>';
      el.hidden = false;
    });
  });
  if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('version');
}

/* ---------- Minuteur de récupération ----------
   Calculé à partir d'un horodatage de fin (D.minuteur.fin) : aucune dérive, même si l'app passe
   en arrière-plan (iOS suspend alors le JavaScript ; au retour, le temps restant est recalculé).
   L'état est enregistré : si l'app est fermée puis rouverte, le minuteur reprend où il en est. */
var tic = null, finSignalee = false, audio = null;
function demarrerMinuteur(sec, lib) {
  D.minuteur = { fin: Date.now() + sec * 1000, total: sec, lib: lib };
  finSignalee = false; sauver(); lancerTic();
}
function arreterMinuteur() { D.minuteur = null; sauver(); clearInterval(tic); tic = null; document.getElementById('minuteur').hidden = true; document.body.classList.remove('avec-minuteur'); }
function lancerTic() { clearInterval(tic); majMinuteur(); tic = setInterval(majMinuteur, 250); }
function majMinuteur() {
  var m = D.minuteur, el = document.getElementById('minuteur');
  if (!m) { el.hidden = true; document.body.classList.remove('avec-minuteur'); clearInterval(tic); return; }
  var reste = Math.ceil((m.fin - Date.now()) / 1000);
  el.hidden = false; document.body.classList.add('avec-minuteur');
  if (reste <= 0) {
    el.classList.add('fini');
    document.getElementById('m-temps').textContent = 'Récup terminée';
    document.getElementById('m-lib').textContent = m.lib;
    if (!finSignalee) { finSignalee = true; signalerFin(); }
    // Le bandeau vert reste 20 s puis disparaît.
    if (Date.now() - m.fin > 20000) arreterMinuteur();
    return;
  }
  el.classList.remove('fini');
  document.getElementById('m-temps').textContent = Math.floor(reste / 60) + ':' + String(reste % 60).padStart(2, '0');
  document.getElementById('m-lib').textContent = 'Récup · ' + m.lib;
  document.getElementById('m-barre').style.width = Math.max(0, Math.min(100, 100 * reste / m.total)) + '%';
}
function surMinuteur(ev) {
  var b = ev.target.closest('[data-m]'); if (!b || !D.minuteur) return;
  var a = b.getAttribute('data-m');
  if (a === 'stop') { arreterMinuteur(); return; }
  var delta = a === '+15' ? 15000 : -15000;
  // Si la récup était finie, +15 repart de maintenant.
  D.minuteur.fin = Math.max(Date.now(), D.minuteur.fin) + delta;
  D.minuteur.total = Math.max(D.minuteur.total, Math.ceil((D.minuteur.fin - Date.now()) / 1000));
  finSignalee = false; sauver(); majMinuteur();
}
// Son : iOS n'autorise l'audio qu'après un geste de l'utilisateur ; on prépare le contexte au tap sur « faite ».
function debloquerSon() {
  try {
    if (!audio) { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); }
    if (audio && audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }
}
function signalerFin() {
  annoncer('Récupération terminée');
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* non pris en charge (iPhone) */ }
  try {
    if (!audio || audio.state !== 'running') return;
    [0, 0.3, 0.6].forEach(function (dt) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      var t0 = audio.currentTime + dt;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) { /* son indisponible : le bandeau vert suffit */ }
}

/* ---------- Écran allumé pendant la séance (Wake Lock API, repli silencieux) ---------- */
var verrou = null;
function etatEcran(t) { var el = document.getElementById('etat-ecran'); if (el) el.textContent = t; }
function garderEcranAllume() {
  if (!('wakeLock' in navigator)) { etatEcran('Écran allumé : non pris en charge par ce navigateur.'); return; }
  if (verrou || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function (v) {
    verrou = v; etatEcran('Écran maintenu allumé pendant la séance.');
    v.addEventListener('release', function () { verrou = null; });
  }).catch(function () { etatEcran('Écran allumé : refusé par le navigateur.'); });
}
function libererEcran() { if (verrou) { try { verrou.release(); } catch (e) {} verrou = null; } }

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    majMinuteur(); if (D && D.minuteur) lancerTic();
    if (COURANT && /^#\/seance\//.test(location.hash)) garderEcranAllume(); // le verrou est perdu en arrière-plan
  }
});

/* ---------- Démarrage ---------- */
function demarrer() {
  charger();
  // Demande au navigateur de ne pas effacer le stockage (sans garantie, surtout sur iOS).
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  var v = document.getElementById('vue');
  v.addEventListener('click', surAction);
  v.addEventListener('input', surSaisie);
  document.getElementById('minuteur').addEventListener('click', surMinuteur);
  fetch('data/plan.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (p) {
      PLAN = p;
      window.addEventListener('hashchange', route);
      route();
      if (D.minuteur) lancerTic();
    })
    .catch(function (err) {
      entete('Renfo Cross', '');
      v.innerHTML = '<div class="bandeau err" role="alert"><b>Plan introuvable.</b> Le fichier data/plan.json n\'a pas pu être chargé (' + esc(err.message) + '). Ouvre l\'app une fois avec du réseau pour la mettre en cache.</div>';
    });
  document.getElementById('maj').addEventListener('click', surAction);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (ev) {
      if (ev.data && ev.data.version) { VERSION_APP = ev.data.version; var el = document.getElementById('version-app'); if (el) el.textContent = VERSION_APP; }
    });
    navigator.serviceWorker.register('sw.js').then(surveillerMiseAJour).catch(function () {});
  }
}
demarrer();
(function () {
  var o = document.getElementById('ouverture');
  if (!o) return;
  function fin() { o.classList.add('fini'); }
  o.addEventListener('animationend', function (e) { if (e.target === o) fin(); });
  o.addEventListener('click', fin);
  setTimeout(fin, 3500);
})();
</script>
